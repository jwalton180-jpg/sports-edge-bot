name = "sportsedge-tennis-sentinel"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
LIVE_TRADING = "false"
ORDER_SUBMISSION_ENABLED = "false"
READ_ONLY_KALSHI = "true"

[[d1_databases]]
binding = "TENNIS_DB"
database_name = "sportsedge-tennis-sentinel"
# Filled dynamically at deployment from the account's actual existing/new D1 UUID.
database_id = "11111111-1111-1111-1111-111111111111"