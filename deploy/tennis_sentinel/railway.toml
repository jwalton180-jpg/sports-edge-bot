# Deploy as a separate Railway worker service, not the Streamlit web app.
# In Railway: Config as Code path = /deploy/tennis_sentinel/railway.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/tennis_sentinel/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckTimeout = 120
