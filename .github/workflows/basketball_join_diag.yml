name: Basketball model join diagnostic
on:
  push:
    branches: [repair-live-model-coverage-20260925]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Diagnose NBA WNBA joins
        run: |
          python - <<'PY'
          from collections import defaultdict
          from datetime import date

          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.data.public_team_data import (
              _basketball_games,
              _basketball_schedule,
              _basketball_team_index,
              _resolve_team_id,
              basketball_team_model,
          )
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import _event_choices, _parse_date

          for sport in ("WNBA","NBA"):
              payload=_basketball_schedule(sport)
              games=_basketball_games(payload)
              index=_basketball_team_index(games)
              print("===",sport,"schedule_games",len(games),"teams",len(index),"===")

              result=fetch_supported_sport_catalog(
                  sports=(sport,), page_limit_per_series=50, page_size=1000,
                  max_workers=4, request_interval_s=0.20,
              )
              grouped=group_kalshi_sports(result.markets)
              events=defaultdict(list)
              for row in grouped.get(sport,[]):
                  if row.family!="Moneyline":
                      continue
                  key=str(row.market.get("event_ticker") or row.market.get("ticker") or "")
                  events[key].append(row)

              for eid, rows in list(events.items())[:12]:
                  choices=_event_choices(rows)
                  if len(choices)!=2:
                      print("BAD",eid,len(choices))
                      continue
                  a,b=choices
                  d=_parse_date(a[3])
                  aid=_resolve_team_id(a[0],index)
                  bid=_resolve_team_id(b[0],index)
                  completed_a=0
                  completed_b=0
                  for game in games:
                      try:
                          gd=date.fromisoformat(str(game.get("gameDateEst") or "")[:10])
                      except Exception:
                          continue
                      if gd>=d or int(game.get("gameStatus") or 0)!=3:
                          continue
                      if "preseason" in str(game.get("gameLabel") or "").lower():
                          continue
                      home=game.get("homeTeam") or {}
                      away=game.get("awayTeam") or {}
                      try:
                          hid=int(home.get("teamId")); wid=int(away.get("teamId"))
                      except Exception:
                          continue
                      if aid in {hid,wid}: completed_a+=1
                      if bid in {hid,wid}: completed_b+=1
                  model=basketball_team_model(sport,a[0],b[0],event_date=d)
                  print("EVENT",eid,"date",d,"A",a[0],aid,completed_a,"B",b[0],bid,completed_b,"MODEL",None if model is None else (round(model.fair_probability,4),round(model.confidence,3)))
          PY
