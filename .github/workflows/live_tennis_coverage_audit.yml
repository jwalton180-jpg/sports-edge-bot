name: Live Tennis Coverage Audit

on:
  push:
    branches:
      - tennis-live-coverage-audit-20261006

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit current Tennis coverage
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.tennis_live import fetch_open_tennis_match_markets, fetch_live_tennis_states
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.tennis_lower_tour import build_lower_tour_live_fallback_candidates
          from sports_edge.models.tennis_live_coverage import build_tennis_live_coverage

          markets=list(fetch_open_tennis_match_markets())
          grouped=group_kalshi_sports(markets)
          candidates=[
              row for row in model_candidates_from_kalshi(grouped, sport_filter='Tennis')
              if row.sport == 'Tennis' and row.market_key == 'model_h2h' and row.kalshi_ticker
          ]
          states=list(fetch_live_tennis_states())
          fallback=build_lower_tour_live_fallback_candidates(markets,states,candidates)
          candidates.extend(fallback)
          coverage=build_tennis_live_coverage(markets,states,candidates)

          print('OPEN_MARKETS',len(markets))
          print('OPEN_MATCHES',coverage.open_matches)
          print('CONFIRMED_LIVE',coverage.confirmed_live_matches)
          print('SCORE_TRACKED',coverage.score_tracked_matches)
          print('MODEL_COVERED_LIVE',coverage.model_covered_live_matches)
          print('UNSUPPORTED_LIVE',coverage.unsupported_live_matches)
          print('SOURCES',coverage.source_counts)
          print('PRIMARY_SIDES',len(candidates)-len(fallback),'FALLBACK_SIDES',len(fallback))

          print('START_PASSED_UNVERIFIED',coverage.start_passed_unverified_matches)
          reasons=Counter(row.unsupported_reason for row in coverage.rows if row.unsupported_reason)
          print('UNSUPPORTED_REASONS',dict(reasons))
          for row in coverage.rows:
              if row.confirmed_live or row.start_passed_unverified:
                  print(
                      'ROW',row.tour,'|', ' vs '.join(row.participants) or row.title,
                      '| confirmed',row.confirmed_live,'| unverified_due',row.start_passed_unverified,
                      '| score',row.score_tracked,'| model',row.model_covered,
                      '| sources',row.score_sources,'| conflict',row.score_conflict,
                      '| reason',row.unsupported_reason or 'OK'
                  )

          assert coverage.open_matches == len({m.get('event_ticker') or m.get('ticker') for m in markets})
          assert coverage.score_tracked_matches == coverage.confirmed_live_matches
          assert coverage.model_covered_live_matches <= coverage.confirmed_live_matches
          assert coverage.unsupported_live_matches <= coverage.confirmed_live_matches
          assert all(row.official_itf_url for row in coverage.rows if row.tour.startswith('ITF'))
          assert all(row.official_itf_url is None for row in coverage.rows if not row.tour.startswith('ITF'))
          print('LIVE_COVERAGE_AUDIT_OK')
          PY
