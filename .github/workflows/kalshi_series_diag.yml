name: Kalshi sports series diagnostic
on:
  push:
    branches: [p0-dynamic-kalshi-catalog-20260925]
jobs:
  diag:
    if: github.event.head_commit.message == 'Add temporary Kalshi series diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Print sports series
        run: |
          python - <<'PY'
          import requests
          base="https://external-api.kalshi.com/trade-api/v2"
          r=requests.get(base+"/series", params={"category":"Sports","include_volume":"true"}, timeout=30)
          print("status",r.status_code,"bytes",len(r.content))
          r.raise_for_status()
          rows=r.json().get("series",[])
          prefixes=("KXMLB","KXNBA","KXWNBA","KXNFL","KXATP","KXWTA","KXITF")
          selected=[x for x in rows if str(x.get("ticker","")).upper().startswith(prefixes)]
          print("series_total",len(rows),"supported_prefix_series",len(selected))
          for x in selected:
              print(
                  x.get("ticker"),
                  "|",x.get("title"),
                  "| cat=",x.get("category"),
                  "| tags=",x.get("tags"),
                  "| updated=",x.get("last_updated_ts"),
                  "| volume=",x.get("volume_fp"),
                  "| product=",x.get("product_metadata"),
              )
          PY
