name: Temporary Tennis collector live probe

on:
  push:
    branches:
      - repair-tennis-prospective-worker-syntax-20261010

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: One real read-only Tennis observation
        shell: bash
        run: |
          set -e -o pipefail
          export PYTHONPATH="$(pwd)"
          python -m py_compile scripts/tennis_reversal_worker.py
          python scripts/tennis_reversal_worker.py --data-dir /tmp/tennis-worker-repaired | tee /tmp/observer-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/observer-output.json').read_text())
          assert row['healthy'] is True, row
          assert row['open_contracts'] > 0, row
          report = json.loads(Path('/tmp/tennis-worker-repaired/report.json').read_text())
          assert report['schema_version'] == 1, report
          print('TENNIS_WORKER_LIVE_PROBE_OK', row['open_contracts'], row['score_states'], row['quoted_snapshots_added'])
          PY
