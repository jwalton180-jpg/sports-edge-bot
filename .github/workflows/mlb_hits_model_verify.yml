name: MLB Hits model verification
on:
  push:
    branches: [mlb-hits-model-20260925]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Full tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q sports_edge app.py launch_on_demand.py
      - name: Critical imports
        run: |
          python - <<'PY'
          from sports_edge.models.mlb_hits_model import project_mlb_hits
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          import sports_edge.app
          print("imports-ok")
          PY
      - name: Live MLB Hits coverage
        run: |
          python - <<'PY'
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg

          result=fetch_supported_sport_catalog(
              sports=("MLB",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=4,
              request_interval_s=0.20,
          )
          assert result.cursor_exhausted, result.error
          grouped=group_kalshi_sports(result.markets)
          hit_rows=[r for r in grouped["MLB"] if r.family=="Hits"]
          candidates=model_candidates_from_kalshi(grouped,sport_filter="MLB")
          hit_candidates=[c for c in candidates if c.market_key=="batter_hits"]
          modeled_tickers={c.kalshi_ticker for c in hit_candidates}
          yes_candidates=[c for c in hit_candidates if c.kalshi_side=="YES"]
          best=[assess_leg(c,"best") for c in hit_candidates]
          longshot=[assess_leg(c,"longshot") for c in hit_candidates]

          print("hit_contracts",len(hit_rows))
          print("modeled_contracts",len(modeled_tickers))
          print("candidate_sides",len(hit_candidates))
          print("yes_candidates",len(yes_candidates))
          print("best_qualified",sum(x.qualified for x in best))
          print("longshot_qualified",sum(x.qualified for x in longshot))
          print("sample",[
              (
                  x.leg.selection,
                  round(x.fair_probability,4),
                  x.kalshi_probability,
                  round(x.edge_points or 0,2),
                  round(x.leg.model_confidence,3),
                  x.qualified,
              )
              for x in sorted(best,key=lambda z:z.score,reverse=True)[:12]
          ])

          if len(hit_rows) >= 5:
              assert len(modeled_tickers) >= 2
      - name: Streamlit smoke
        shell: bash
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 >/tmp/streamlit.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/tmp/health.txt 2>/dev/null; then
              cat /tmp/health.txt
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $PID || true
          exit 1
