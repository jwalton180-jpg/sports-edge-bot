name: Live NFL volume props diagnostic

on:
  push:
    branches: [nfl-volume-props-20260925]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit NFL volume prop coverage
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg, build_intelligent_parlay

          result = fetch_supported_sport_catalog(
              sports=("NFL",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.15,
          )
          grouped = group_kalshi_sports(result.markets)
          rows = grouped.get("NFL", [])
          families = Counter(r.family for r in rows)

          candidates = model_candidates_from_kalshi(
              grouped,
              sport_filter="NFL",
              include_nfl_pass_attempts=True,
              include_nfl_pass_completions=True,
              include_nfl_pass_interceptions=True,
              max_nfl_passing_players=12,
              include_nfl_rush_attempts=True,
              include_nfl_rush_receiving_yards=True,
              max_nfl_rushing_players=12,
          )
          keys = {
              "player_pass_attempts",
              "player_pass_completions",
              "player_pass_interceptions",
              "player_rush_attempts",
              "player_rush_reception_yds",
          }
          volume = [c for c in candidates if c.market_key in keys]
          assessments = [assess_leg(c, "best") for c in volume]
          qualified = [a for a in assessments if a.qualified]
          ticket = build_intelligent_parlay(
              volume,
              mode="best",
              target_legs=4,
              max_per_event=1,
          )

          print("catalog_error", result.error)
          print("catalog_complete", result.cursor_exhausted)
          print("family_counts", dict(families))
          print("volume_market_counts", {
              k: families.get(k, 0)
              for k in (
                  "Pass Attempts", "Pass Completions", "Pass Interceptions",
                  "Rush Attempts", "Rushing + Receiving Yards", "Other NFL",
              )
          })
          print("candidate_by_key", dict(Counter(c.market_key for c in volume)))
          print("qualified_by_key", dict(Counter(a.leg.market_key for a in qualified)))
          print("qualified_total", len(qualified))
          print("ticket_legs", len(ticket.legs))
          event_ids = [x.leg.event_id for x in ticket.legs]
          print("ticket_event_ids", event_ids)
          assert len(event_ids) == len(set(event_ids)), "max_per_event=1 admitted duplicate canonical game IDs"
          print("ticket", [
              (
                  x.leg.market_key,
                  x.leg.selection,
                  x.leg.event_title,
                  round(x.fair_probability, 4),
                  round(x.kalshi_probability or 0, 4),
                  round(x.edge_points or 0, 2),
                  round(x.leg.model_confidence, 3),
                  x.leg.model_sample_size,
              )
              for x in ticket.legs
          ])
          for key in sorted(keys):
              subset = [a for a in assessments if a.leg.market_key == key]
              print("TOP", key, [
                  (
                      a.leg.selection,
                      round(a.fair_probability, 4),
                      round(a.kalshi_probability or 0, 4),
                      round(a.edge_points or 0, 2),
                      round(a.leg.model_confidence, 3),
                      a.qualified,
                  )
                  for a in sorted(subset, key=lambda x:x.score, reverse=True)[:6]
              ])
          PY
