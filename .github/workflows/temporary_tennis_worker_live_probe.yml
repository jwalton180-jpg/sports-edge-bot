name: Temporary Tennis worker live preflight
on:
  push:
    branches: [tennis-worker-import-preflight-20261009]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Verify real one-shot worker and data
        run: |
          export PYTHONPATH="$(pwd)"
          python -m py_compile scripts/tennis_reversal_worker.py
          python scripts/tennis_reversal_worker.py --data-dir /tmp/tennis-worker-probe
          cat /tmp/tennis-worker-probe/report.json
