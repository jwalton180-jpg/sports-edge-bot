name: Live WNBA player prop diagnostic

on:
  push:
    branches: [wnba-player-prop-models-20260929]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit live model-first WNBA player props
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg, build_intelligent_parlay

          result=fetch_supported_sport_catalog(
              sports=("WNBA",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.15,
          )
          grouped=group_kalshi_sports(result.markets)
          candidates=model_candidates_from_kalshi(
              grouped,
              sport_filter="WNBA",
              include_wnba_game_lines=True,
              include_wnba_player_props=True,
              max_wnba_players=24,
          )
          player_keys={
              "player_points","player_rebounds","player_assists",
              "player_threes","player_points_rebounds_assists",
          }
          player=[c for c in candidates if c.market_key in player_keys]
          assessments=[assess_leg(c,"best") for c in player]
          qualified=[a for a in assessments if a.qualified]
          ticket=build_intelligent_parlay(
              player,
              mode="best",
              target_legs=4,
              max_per_event=1,
          )

          print("catalog_error",result.error)
          print("catalog_complete",result.cursor_exhausted)
          print("wnba_markets",len(grouped.get("WNBA",[])))
          print("candidate_by_key",dict(Counter(c.market_key for c in player)))
          print("qualified_by_key",dict(Counter(a.leg.market_key for a in qualified)))
          print("player_candidates",len(player))
          print("qualified_total",len(qualified))
          print("canonical_games",len({c.event_id for c in player}))
          print("ticket_legs",len(ticket.legs))
          print("ticket_unique_games",len({x.leg.event_id for x in ticket.legs}))
          print("ticket",[
              (
                  x.leg.market_key,
                  x.leg.selection,
                  x.leg.event_title,
                  round(x.fair_probability,4),
                  round(x.kalshi_probability or 0,4),
                  round(x.edge_points or 0,2),
                  round(x.leg.model_confidence,3),
                  x.leg.model_sample_size,
              )
              for x in ticket.legs
          ])
          print("TOP",[
              (
                  a.qualified,
                  a.leg.market_key,
                  a.leg.selection,
                  round(a.fair_probability,4),
                  round(a.kalshi_probability or 0,4),
                  round(a.edge_points or 0,2),
                  round(a.leg.model_confidence,3),
                  list(a.leg.model_reasons)[:4],
                  list(a.leg.model_warnings)[:3],
              )
              for a in sorted(assessments,key=lambda x:x.score,reverse=True)[:15]
          ])
          assert len(ticket.legs)==len({x.leg.event_id for x in ticket.legs}), "duplicate WNBA game in ticket"
          PY
