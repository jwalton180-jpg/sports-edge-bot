name: Temporary Tennis prospective live probe
on:
  push:
    branches: [tennis-prospective-collector-20261009]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe live observer without changing durable data
        run: |
          export PYTHONPATH="$(pwd)"
          python scripts/tennis_reversal_worker.py --data-dir /tmp/tennis-reversal-probe
          cat /tmp/tennis-reversal-probe/report.json
