name: Five-sport all-game joint parlay research
on:
  pull_request:
    branches: [main]
    paths:
      - "sports_edge/models/all_game_joint_research.py"
      - "sports_edge/app.py"
      - "tests/test_all_game_joint_research.py"
      - ".github/workflows/all_game_joint_research_ci.yml"
  push:
    branches: [main]
    paths:
      - "sports_edge/models/all_game_joint_research.py"
      - "sports_edge/app.py"
      - "tests/test_all_game_joint_research.py"
      - ".github/workflows/all_game_joint_research_ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-sport-all-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Five-sport causal joint scenarios and every-game board
        run: python -m pytest -q tests/test_all_game_joint_research.py tests/test_tnf_research.py tests/test_parlay_intelligence.py tests/test_same_player_dependence.py
      - name: Streamlit and independent research syntax
        run: python -m compileall -q sports_edge/app.py sports_edge/models/all_game_joint_research.py
