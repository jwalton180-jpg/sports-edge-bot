name: Application sleeper integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sleeper-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Model, rule, quote, ledger and mobile action regressions
        run: python -m pytest -q tests/test_application_sleepers.py tests/test_sleeper_panel.py tests/test_prospective_promotion.py
      - name: Official NHL and nflverse source integration smoke (not representative validation)
        run: python -m scripts.run_sleeper_replay --output-dir sleeper-source-smoke --sample-size 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sleeper-source-evidence
          path: sleeper-source-smoke/
          if-no-files-found: error
          retention-days: 30
