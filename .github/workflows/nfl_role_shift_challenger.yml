name: NFL role-shift chronological challenger

on:
  push:
    branches: [adaptive-player-team-intelligence-20260929]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compare next-game volume baseline vs role-shift adaptation
        run: |
          python - <<'PY'
          from collections import defaultdict
          from statistics import mean
          from sports_edge.data.nfl_prop_data import player_week_rows
          from sports_edge.models.nfl_prop_models import _blend_mean, _role_shift

          def f(row,key):
              try:return float(row.get(key) or 0.0)
              except Exception:return 0.0

          for season in (2025,2026):
              current=list(player_week_rows(season))
              prior=list(player_week_rows(season-1))
              prior_by=defaultdict(list)
              for r in prior:
                  if str(r.get("season_type") or "").upper() not in {"REG",""}: continue
                  prior_by[str(r.get("player_id") or "")].append(r)
              cur_by=defaultdict(list)
              for r in current:
                  if str(r.get("season_type") or "").upper() not in {"REG",""}: continue
                  cur_by[str(r.get("player_id") or "")].append(r)
              for rows in cur_by.values():
                  rows.sort(key=lambda r:int(float(r.get("week") or 0)))
              for rows in prior_by.values():
                  rows.sort(key=lambda r:int(float(r.get("week") or 0)))

              for key,min_actual in (("targets",1.0),("carries",1.0)):
                  base_err=[]; adapt_err=[]; shifted=0
                  for pid,rows in cur_by.items():
                      pvals=[f(r,key) for r in prior_by.get(pid,[])]
                      history=[]
                      for row in rows:
                          actual=f(row,key)
                          if len(history)>=3:
                              base,_=_blend_mean(history,pvals)
                              mult,_=_role_shift(history)
                              adaptive=base*mult
                              if actual>=min_actual or base>=min_actual:
                                  base_err.append(abs(base-actual))
                                  adapt_err.append(abs(adaptive-actual))
                                  shifted += int(abs(mult-1.0)>=0.015)
                          history.append(actual)
                  if base_err:
                      b=mean(base_err); a=mean(adapt_err)
                      print("RESULT",season,key,"n",len(base_err),"shifted",shifted,
                            "base_mae",round(b,5),"adaptive_mae",round(a,5),
                            "delta",round(a-b,5),"pct",round((a/b-1)*100,3))
          PY
