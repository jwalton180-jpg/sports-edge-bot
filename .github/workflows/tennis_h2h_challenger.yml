name: Tennis H2H chronological challenger

on:
  push:
    branches: [repair-canonical-event-identity-tennis-20260929]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compare prequential 2026 Tennis model with and without H2H
        run: |
          python - <<'PY'
          from collections import defaultdict, deque
          from datetime import datetime
          from math import exp, log
          from statistics import mean
          from sports_edge.core.math import clamp
          from sports_edge.data.tennis_history import load_recent_tennis_rows

          def f(row,key):
              try:
                  v=row.get(key)
                  return None if v in (None,"") else float(v)
              except (TypeError,ValueError):
                  return None

          def d(row):
              raw=str(row.get("tourney_date") or "")
              try: return datetime.strptime(raw,"%Y%m%d").date()
              except Exception: return None

          def norm(s):
              import re, unicodedata
              raw=(s or "").lower()
              raw=unicodedata.normalize("NFKD",raw)
              raw="".join(ch for ch in raw if not unicodedata.combining(ch))
              return " ".join(re.findall(r"[a-z0-9]+",raw))

          class S:
              def __init__(self):
                  self.elo=1500.0; self.matches=0
                  self.results=deque(maxlen=20); self.dates=deque(maxlen=20)
                  self.serve=deque(maxlen=20); self.ret=deque(maxlen=20)
                  self.minutes=deque(maxlen=20)

          def avg(x):
              x=list(x); return mean(x) if x else None
          def recent(x,n):
              x=list(x); return mean(x[-n:]) if x else None
          def elo_p(a,b):
              return 1/(1+10**((b-a)/400))
          def logistic(p,adj):
              p=clamp(p,.01,.99); z=log(p/(1-p))+adj
              return 1/(1+exp(-z))
          def fatigue(s,today):
              matches=sum(1 for x in s.dates if 0 <= (today-x).days <= 7)
              mins=sum(list(s.minutes)[-5:]) if s.minutes else 0
              return matches,mins

          def base_prob(a,b,level,today):
              base=elo_p(a.elo,b.elo); p=base
              fa,fb=avg(a.results),avg(b.results)
              if fa is not None and fb is not None:
                  p=logistic(p,.55*clamp(fa-fb,-.6,.6))
              sa,sb,la,lb=recent(a.results,5),recent(b.results,5),avg(a.results),avg(b.results)
              if None not in (sa,sb,la,lb):
                  p=logistic(p,.28*clamp((sa-la)-(sb-lb),-.6,.6))
              av=[avg(a.serve),avg(b.serve),avg(a.ret),avg(b.ret)]
              if all(x is not None for x in av):
                  p=logistic(p,2.2*clamp((av[0]+av[2])-(av[1]+av[3]),-.2,.2))
              vals=[recent(a.serve,5),recent(a.ret,5),recent(b.serve,5),recent(b.ret,5),*av]
              if all(x is not None for x in vals):
                  at=(vals[0]+vals[1])-(vals[4]+vals[6])
                  bt=(vals[2]+vals[3])-(vals[5]+vals[7])
                  p=logistic(p,1.25*clamp(at-bt,-.12,.12))
              ma,mna=fatigue(a,today); mb,mnb=fatigue(b,today)
              adj=(mb-ma)*.025+clamp((mnb-mna)/900,-.12,.12)
              if abs(adj)>1e-9: p=logistic(p,adj)
              if level=="ITF": p=base
              elif level=="Challenger": p=.5*p+.5*base
              return clamp(p,.03,.97)

          def level_name(row):
              lv=str(row.get("tourney_level") or "").upper()
              if lv in {"F","I"}: return "ITF"
              if lv in {"C","D"}: return "Challenger"
              return "Tour"

          def h2h_adj(h2h,a,b,today,level,surface):
              meetings=[m for m in h2h.get(tuple(sorted((a,b))),[]) if m[0] < today]
              if not meetings: return 0.0,0
              wa=wb=0.0
              for md,winner,loser,msurf,mlvl in meetings:
                  age=max(0,(today-md).days); w=.5**(age/730)
                  if surface and msurf and surface==msurf: w*=1.25
                  if ((level=="Challenger" and mlvl in {"C","D"}) or
                      (level=="ITF" and mlvl in {"F","I"}) or
                      (level=="Tour" and mlvl in {"G","M","A"})): w*=1.10
                  if winner==a: wa+=w
                  elif winner==b: wb+=w
              total=wa+wb
              if total<=0:return 0.0,0
              post=(2+wa)/(4+total); strength=total/(total+3)
              return clamp(1.6*(post-.5)*strength,-.28,.28),len(meetings)

          def metric_add(store,key,p,y):
              p=clamp(p,.001,.999)
              s=store[key]
              s[0]+=1; s[1]+=(p-y)**2; s[2]+=-(y*log(p)+(1-y)*log(1-p))

          for gender in ("men","women"):
              rows=list(load_recent_tennis_rows(gender,2025,2026))
              rows.sort(key=lambda r:(str(r.get("tourney_date") or ""),str(r.get("match_num") or "")))
              states=defaultdict(S); h2h=defaultdict(list)
              metrics=defaultdict(lambda:[0,0.0,0.0])
              h2h_metrics=defaultdict(lambda:[0,0.0,0.0])

              for row in rows:
                  winner=norm(row.get("winner_name")); loser=norm(row.get("loser_name")); md=d(row)
                  if not winner or not loser or md is None: continue
                  sw,sl=states[winner],states[loser]
                  level=level_name(row); surface=str(row.get("surface") or "").strip().lower()

                  if md.year==2026 and min(sw.matches,sl.matches)>=3:
                      a,b=sorted((winner,loser))
                      sa,sb=states[a],states[b]
                      y=1.0 if winner==a else 0.0
                      p0=base_prob(sa,sb,level,md)
                      adj,n=h2h_adj(h2h,a,b,md,level,surface)
                      p1=logistic(p0,adj) if n else p0
                      for key in ("ALL",level):
                          metric_add(metrics,key,p0,y); metric_add(h2h_metrics,key,p1,y)
                      if n:
                          metric_add(metrics,"H2H_ONLY",p0,y); metric_add(h2h_metrics,"H2H_ONLY",p1,y)

                  expected=elo_p(sw.elo,sl.elo)
                  lv=str(row.get("tourney_level") or "").upper()
                  k=28 if lv in {"G","M","A"} else (24 if lv in {"C","D"} else 20)
                  delta=k*(1-expected); sw.elo+=delta; sl.elo-=delta
                  sw.matches+=1; sl.matches+=1
                  sw.results.append(1.0); sl.results.append(0.0)
                  sw.dates.append(md); sl.dates.append(md)

                  wsv,w1,w2=f(row,"w_svpt"),f(row,"w_1stWon"),f(row,"w_2ndWon")
                  lsv,l1,l2=f(row,"l_svpt"),f(row,"l_1stWon"),f(row,"l_2ndWon")
                  if wsv and wsv>0 and w1 is not None and w2 is not None:
                      x=clamp((w1+w2)/wsv,0,1); sw.serve.append(x); sl.ret.append(1-x)
                  if lsv and lsv>0 and l1 is not None and l2 is not None:
                      x=clamp((l1+l2)/lsv,0,1); sl.serve.append(x); sw.ret.append(1-x)
                  mins=f(row,"minutes")
                  if mins and mins>0: sw.minutes.append(mins); sl.minutes.append(mins)
                  h2h[tuple(sorted((winner,loser)))].append((md,winner,loser,surface,lv))

              print("GENDER",gender)
              for key in ("ALL","Tour","Challenger","ITF","H2H_ONLY"):
                  n,brier0,ll0=metrics[key]; n1,brier1,ll1=h2h_metrics[key]
                  if not n: continue
                  print("METRIC",key,"n",n,
                        "base_brier",round(brier0/n,6),
                        "h2h_brier",round(brier1/n1,6),
                        "delta_brier",round((brier1/n1)-(brier0/n),6),
                        "base_logloss",round(ll0/n,6),
                        "h2h_logloss",round(ll1/n1,6),
                        "delta_logloss",round((ll1/n1)-(ll0/n),6))
          PY
