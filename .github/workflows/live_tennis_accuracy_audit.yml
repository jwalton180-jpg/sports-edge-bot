name: Live Tennis Accuracy Audit

on:
  push:
    branches:
      - tennis-live-probability-accuracy-20261005

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit current Tennis reversal universe
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.tennis_live import (
              fetch_open_tennis_match_markets,
              fetch_tennis_candle_history,
              fetch_espn_live_tennis_states,
          )
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.tennis_live_reversal import build_tennis_reversal_radar

          markets = list(fetch_open_tennis_match_markets())
          grouped = group_kalshi_sports(markets)
          candidates = [
              row for row in model_candidates_from_kalshi(grouped, sport_filter='Tennis')
              if row.sport == 'Tennis' and row.market_key == 'model_h2h' and row.kalshi_ticker
          ]
          states = list(fetch_espn_live_tennis_states())
          state_index = {(row.event_id, row.selection_key): row for row in states}
          confirmed = {row.event_id for row in states}
          tickers = tuple(sorted({str(row.kalshi_ticker) for row in candidates if row.kalshi_ticker}))
          candles = fetch_tennis_candle_history(tickers, lookback_minutes=60, period_interval=1)
          radar = build_tennis_reversal_radar(
              candidates, candles, confirmed_live_event_ids=confirmed, live_states=state_index
          )

          counts = Counter(row.status for row in radar)
          print('open_match_markets=', len(markets))
          print('modeled_sides=', len(candidates))
          print('score_states=', len(states), 'confirmed_matches=', len(confirmed))
          print('candle_tickers=', len(candles))
          print('radar_rows=', len(radar), 'status_counts=', dict(counts))

          event_ids = [row.event_id for row in radar]
          assert len(event_ids) == len(set(event_ids)), 'duplicate physical match in radar'

          for row in radar[:25]:
              print(
                  row.status, '|', row.selection, '| price', f'{row.current_price:.3f}',
                  '| live', f'{row.live_probability:.3f}' if row.live_probability is not None else 'NA',
                  '| edge_pp', f'{row.live_edge_points:.1f}' if row.live_edge_points is not None else 'NA',
                  '| spread_pp', f'{row.current_spread_points:.1f}' if row.current_spread_points is not None else 'NA',
                  '| confirms', row.recovery_confirmations, '| breaks', row.net_break_advantage,
                  '| bo', row.best_of, '| tb', row.at_tiebreak, '| score', f'{row.score:.1f}',
              )

          for row in radar:
              if row.status in {'DEEP REVERSAL', 'REVERSAL SIGNAL'}:
                  assert row.live_probability is not None
                  assert row.live_edge_points is not None and row.live_edge_points > 0
                  assert row.quote_quality
                  assert row.recovery_confirmations >= 2
                  assert not row.at_tiebreak
              if row.status == 'DEEP REVERSAL':
                  assert row.net_break_advantage is None or row.net_break_advantage >= 0
                  assert row.live_probability >= 0.18
                  assert row.live_edge_points >= max(5.0, row.current_price * 25.0)

          print('LIVE_AUDIT_OK')
          PY
