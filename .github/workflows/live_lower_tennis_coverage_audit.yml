name: Live Lower Tennis Coverage Audit

on:
  push:
    branches:
      - tennis-itf-challenger-live-score-20261006

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit live Challenger and ITF coverage
        run: |
          python - <<'PY'
          from collections import Counter
          import requests

          from sports_edge.data.tennis365 import TENNIS365_LIVE_URL, fetch_tennis365_live_matches
          from sports_edge.data.tennis_live import (
              fetch_live_tennis_states,
              fetch_open_tennis_match_markets,
              fetch_tennis_candle_history,
          )
          from sports_edge.models.event_identity import canonical_participant
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.tennis_live_reversal import build_tennis_reversal_radar
          from sports_edge.models.tennis_lower_tour import build_lower_tour_live_fallback_candidates

          response = requests.get(
              TENNIS365_LIVE_URL,
              headers={"User-Agent":"SportsEdgeReadOnly/1.0","Accept":"text/html,application/xhtml+xml"},
              timeout=15,
          )
          print('TENNIS365_STATUS', response.status_code, 'LEN', len(response.text))
          response.raise_for_status()

          raw_lower = list(fetch_tennis365_live_matches())
          states = list(fetch_live_tennis_states())
          lower_states = [row for row in states if row.tour in {'CHALLENGER','ITF','ITF-W'}]
          physical_lower = {}
          for row in lower_states:
              parts = str(row.event_id).split(':', 2)
              pair = parts[2] if len(parts) == 3 else row.event_id
              physical_lower.setdefault(pair, row)

          markets = list(fetch_open_tennis_match_markets())
          grouped = group_kalshi_sports(markets)
          primary = [
              row for row in model_candidates_from_kalshi(grouped, sport_filter='Tennis')
              if row.sport == 'Tennis' and row.market_key == 'model_h2h' and row.kalshi_ticker
          ]
          fallback = build_lower_tour_live_fallback_candidates(markets, states, primary)
          candidates = [*primary, *fallback]
          state_index = {(row.event_id,row.selection_key):row for row in states}
          tickers = tuple(sorted({str(row.kalshi_ticker) for row in candidates if row.kalshi_ticker}))
          candles = fetch_tennis_candle_history(tickers,lookback_minutes=60,period_interval=1)
          radar = build_tennis_reversal_radar(
              candidates,candles,
              confirmed_live_event_ids={row.event_id for row in states},
              live_states=state_index,
          )

          print('open_markets=',len(markets))
          print('primary_candidates=',len(primary),'fallback_candidates=',len(fallback),'all_candidates=',len(candidates))
          print('raw_lower_matches=',len(raw_lower),'all_score_states=',len(states),'lower_player_states=',len(lower_states),'lower_physical_matches=',len(physical_lower))
          print('state_tours=',dict(Counter(row.tour for row in states)))
          print('state_sources=',dict(Counter('+'.join(row.score_sources) or 'none' for row in states)))
          print('candle_tickers=',len(candles),'radar_rows=',len(radar),'radar_status=',dict(Counter(row.status for row in radar)))

          assert len(lower_states) == len(raw_lower) * 2, 'lower-tour match->player state expansion mismatch'
          for row in lower_states:
              assert row.score_sources == ('Tennis365',), row.score_sources
              assert row.source_url and row.source_url.startswith('https://livescore.tennis365.com')
              assert row.best_of == 3 and row.sets_to_win == 2
              assert 1 <= row.period <= 3
              assert row.player_games is not None and row.opponent_games is not None
              assert row.player_sets >= 0 and row.opponent_sets >= 0
              assert not row.score_conflict, row.score_label

          # If a current Kalshi lower-tour model hole overlaps a live state, the
          # conservative ranking/prior-form fallback is allowed to fill it.
          primary_pairs = set()
          for row in primary:
              parts = str(row.event_id).split(':',2)
              if len(parts) == 3:
                  primary_pairs.add(parts[2])
          fallback_pairs = set()
          for row in fallback:
              parts = str(row.event_id).split(':',2)
              if len(parts) == 3:
                  fallback_pairs.add(parts[2])
          print('primary_pairs=',len(primary_pairs),'fallback_pairs=',len(fallback_pairs))

          event_ids = [row.event_id for row in radar]
          assert len(event_ids) == len(set(event_ids)), 'duplicate physical match in radar'
          for row in radar:
              if row.status in {'DEEP REVERSAL','REVERSAL SIGNAL'}:
                  assert row.confirmed_live
                  assert row.live_probability is not None
                  assert row.live_edge_points is not None and row.live_edge_points > 0
                  assert row.quote_quality
                  assert row.recovery_confirmations >= 2
                  assert not row.at_tiebreak
                  assert not row.score_conflict
              if row.status == 'DEEP REVERSAL' and str(row.model_name if hasattr(row,'model_name') else '').startswith('Tennis lower-tour'):
                  assert row.net_break_advantage is not None and row.net_break_advantage >= 1

          if lower_states:
              print('LIVE_LOWER_TOUR_SAMPLE_OK')
              for row in list(physical_lower.values())[:10]:
                  print('LIVE',row.tour,'|',row.player,'vs',row.opponent,'|',row.score_label,'| server',row.serving,'| breaks',row.net_break_advantage,'| points',row.point_score)
          else:
              print('NO_CURRENT_LOWER_TOUR_MATCHES; endpoint reachable and deterministic parser regressions cover ITF/Challenger fixtures')

          print('LOWER_TOUR_LIVE_AUDIT_OK')
          PY
