name: Live WNBA game-line model diagnostic

on:
  push:
    branches: [basketball-prop-models-20260925]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit live WNBA model-first game lines
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg, build_intelligent_parlay

          result = fetch_supported_sport_catalog(
              sports=("WNBA",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.15,
          )
          grouped = group_kalshi_sports(result.markets)
          rows = grouped.get("WNBA", [])
          family_counts = Counter(r.family for r in rows)

          candidates = model_candidates_from_kalshi(
              grouped,
              sport_filter="WNBA",
              include_wnba_game_lines=True,
          )
          keys={"model_h2h","wnba_spread","wnba_game_total","wnba_team_total"}
          candidates=[c for c in candidates if c.market_key in keys]
          assessments=[assess_leg(c,"best") for c in candidates]
          qualified=[a for a in assessments if a.qualified]
          ticket=build_intelligent_parlay(
              candidates,
              mode="best",
              target_legs=4,
              max_per_event=1,
          )

          from sports_edge.data.public_team_data import _wnba_schedule_rows
          from sports_edge.models.wnba_lines_model import _match_event_row
          sched=_wnba_schedule_rows()
          for d in ("2026-09-26","2026-09-27","2026-09-28","2026-09-29","2026-09-30","2026-10-01"):
              matches=[r for r in sched if str(r.get("game_date") or r.get("start_date") or "")[:10]==d]
              if matches:
                  print("SCHEDULE_DATE",d,[{k:r.get(k) for k in ("game_date","start_date","home_id","away_id","home_display_name","away_display_name","home_abbreviation","away_abbreviation")} for r in matches])
          for row in rows:
              if row.family in {"Spread","Game Total","Team Total"}:
                  m=row.market
                  print("LINE_MARKET_SAMPLE",row.family,{k:m.get(k) for k in ("event_ticker","ticker","title","floor_strike")})
                  print("MATCH_RESULT",_match_event_row(sched,__import__("sports_edge.models.kalshi_model_candidates",fromlist=["_parse_date"])._parse_date(m),str(m.get("event_ticker") or "")))
                  break

          print("catalog_error",result.error)
          print("catalog_complete",result.cursor_exhausted)
          print("wnba_markets",len(rows))
          print("family_counts",dict(family_counts))
          print("candidate_by_key",dict(Counter(c.market_key for c in candidates)))
          print("qualified_by_key",dict(Counter(a.leg.market_key for a in qualified)))
          print("qualified_total",len(qualified))
          print("ticket_legs",len(ticket.legs))
          event_ids=[x.leg.event_id for x in ticket.legs]
          print("ticket_event_ids",event_ids)
          assert len(event_ids)==len(set(event_ids)), "same-game WNBA legs bypassed max_per_event=1"
          print("ticket",[
              (
                  x.leg.market_key,
                  x.leg.selection,
                  x.leg.event_title,
                  round(x.fair_probability,4),
                  round(x.kalshi_probability or 0,4),
                  round(x.edge_points or 0,2),
                  round(x.leg.model_confidence,3),
                  x.leg.model_sample_size,
              )
              for x in ticket.legs
          ])
          for key in sorted(keys):
              subset=[a for a in assessments if a.leg.market_key==key]
              print("TOP",key,[
                  (
                      a.leg.selection,
                      round(a.fair_probability,4),
                      round(a.kalshi_probability or 0,4),
                      round(a.edge_points or 0,2),
                      round(a.leg.model_confidence,3),
                      a.qualified,
                  )
                  for a in sorted(subset,key=lambda x:x.score,reverse=True)[:8]
              ])
          PY
