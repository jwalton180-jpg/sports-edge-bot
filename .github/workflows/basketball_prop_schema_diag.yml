name: Basketball prop schema diagnostic

on:
  push:
    branches: [basketball-prop-models-20260925]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyarrow
      - name: Inspect Kalshi basketball props and player-box schemas
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from io import BytesIO
          import pandas as pd
          import requests
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports

          result = fetch_supported_sport_catalog(
              sports=("NBA","WNBA"),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.15,
          )
          grouped = group_kalshi_sports(result.markets)
          print("catalog_error", result.error)
          print("catalog_complete", result.cursor_exhausted)
          for sport in ("NBA","WNBA"):
              rows=grouped.get(sport,[])
              counts=Counter(r.family for r in rows)
              print("SPORT_COUNTS", sport, len(rows), dict(counts))
              samples=defaultdict(list)
              for r in rows:
                  if len(samples[r.family])<3:
                      m=r.market
                      samples[r.family].append({
                          "series":m.get("series_ticker"),
                          "ticker":m.get("ticker"),
                          "title":m.get("title"),
                          "floor":m.get("floor_strike"),
                          "yes":m.get("yes_ask_dollars"),
                      })
              for family,n in counts.most_common(25):
                  print("SAMPLE",sport,family,n,samples[family])

          sources={
              "WNBA2026":"https://raw.githubusercontent.com/sportsdataverse/wehoop-wnba-data/main/wnba/player_box/parquet/player_box_2026.parquet",
              "WNBA2025":"https://raw.githubusercontent.com/sportsdataverse/wehoop-wnba-data/main/wnba/player_box/parquet/player_box_2025.parquet",
              "NBA2026":"https://raw.githubusercontent.com/sportsdataverse/hoopR-nba-data/main/nba/player_box/parquet/player_box_2026.parquet",
              "NBA2025":"https://raw.githubusercontent.com/sportsdataverse/hoopR-nba-data/main/nba/player_box/parquet/player_box_2025.parquet",
          }
          for label,url in sources.items():
              resp=requests.get(url,timeout=30); resp.raise_for_status()
              df=pd.read_parquet(BytesIO(resp.content))
              print("BOX_SCHEMA",label,len(df),list(df.columns))
              print("BOX_DATES",label,[(c,str(df[c].min()),str(df[c].max())) for c in df.columns if "date" in c.lower()][:6])
              keep=[c for c in ("game_id","game_date","athlete_id","athlete_display_name","team_id","team_name","opponent_team_id","opponent_team_name","minutes","field_goals_made","three_point_field_goals_made","rebounds","assists","points","steals","blocks","starter","did_not_play") if c in df.columns]
              print("BOX_SAMPLE",label,df[keep].tail(3).to_dict("records"))
          PY
