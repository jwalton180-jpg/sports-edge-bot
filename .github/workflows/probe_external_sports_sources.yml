name: Probe TennisExplorer SofaScore

on:
  push:
    branches:
      - multi-source-sportsedge-intelligence-20261007

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Validate external sports sources
        run: |
          python - <<'PY'
          from datetime import date
          from sports_edge.data.tennisexplorer import fetch_tennisexplorer_pair_context
          from sports_edge.data.sofascore import fetch_sofascore_live_snapshot

          pairs = [
              ("Guido Ivan Justo", "Francisco Comesana"),
              ("Darwin Andres Macias Elizalde", "Felipe de Dios"),
          ]
          for a, b in pairs:
              ctx = fetch_tennisexplorer_pair_context(
                  a, b, as_of=date(2026, 10, 7), timeout=15
              )
              assert ctx is not None, f"TennisExplorer pair failed: {a} vs {b}"
              print(
                  "TENNIS_EXPLORER",
                  a, "| rank", ctx.player_a.rank,
                  "| recent", f"{ctx.player_a.recent_wins}-{ctx.player_a.recent_losses}",
                  "| h2h", f"{ctx.player_a.h2h_wins}-{ctx.player_a.h2h_losses}",
                  "|", b, "| rank", ctx.player_b.rank,
                  "| recent", f"{ctx.player_b.recent_wins}-{ctx.player_b.recent_losses}",
              )
              assert ctx.player_a.rank is not None or ctx.player_a.recent_matches >= 4
              assert ctx.player_b.rank is not None or ctx.player_b.recent_matches >= 4

          snapshot = fetch_sofascore_live_snapshot(timeout=10)
          assert {x.sport for x in snapshot} == {"Tennis", "MLB", "NFL", "NBA", "WNBA"}
          for result in snapshot:
              print(
                  "SOFASCORE",
                  result.sport,
                  "| available", result.available,
                  "| blocked", result.blocked,
                  "| status", result.status_code,
                  "| events", len(result.events),
                  "| error", result.error,
              )
              if result.blocked:
                  assert not result.available
                  assert result.events == ()
              if result.available:
                  assert result.status_code == 200
          print("EXTERNAL_SOURCE_AUDIT_OK")
          PY
