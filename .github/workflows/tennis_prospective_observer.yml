name: Tennis prospective observer

on:
  schedule:
    # Best-effort polling, not continuous second-by-second collection.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tennis_prospective_observer.yml
      - scripts/tennis_reversal_worker.py
      - sports_edge/models/tennis_prospective_store.py

permissions:
  contents: write

concurrency:
  group: sportsedge-tennis-prospective-ledger
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_TRADING: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      READ_ONLY_KALSHI: "true"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - name: Checkout prospective data branch
        uses: actions/checkout@v4
        with:
          ref: tennis-prospective-data
          path: ledger
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install read-only analysis dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Preflight standalone Tennis worker
        shell: bash
        run: |
          export PYTHONPATH="$(pwd)/code"
          python -m py_compile code/scripts/tennis_reversal_worker.py
          python -c "from scripts.tennis_reversal_worker import observe_once; print('tennis-worker-import-ok')"
      - name: Poll Tennis repeatedly while runner is active
        id: observe
        shell: bash
        run: |
          # GitHub schedule actually launches 15-26 minutes apart here.
          # Sample every ~60s during a bounded job, checkpoint every fourth.
          # This is NOT a guaranteed continuously connected feed.
          set +e
          set -o pipefail
          export PYTHONPATH="$(pwd)/code"
          cd ledger
          git config user.name "SportsEdge Research Bot"
          git config user.email "actions@users.noreply.github.com"
          cd ..
          failures=0
          successes=0
          for n in $(seq 1 12); do
            python code/scripts/tennis_reversal_worker.py --data-dir ledger/research/tennis_prospective --max-grades 100 | tee "/tmp/tennis_observer_$n.json"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              successes=$((successes+1))
            else
              failures=$((failures+1))
              echo "::warning::Tennis poll $n degraded (exit $rc)"
            fi
            if [ "$((n % 4))" -eq 0 ]; then
              (
                set -e
                cd ledger
                git add -- research/tennis_prospective
                if ! git diff --cached --quiet; then
                  git commit -m "Tennis prospective burst $n/12 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  git push origin HEAD:tennis-prospective-data
                fi
              )
              persist_rc=$?
              if [ "$persist_rc" -ne 0 ]; then
                echo "::error::Durable ledger checkpoint failed"
                echo "exit_code=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if [ "$n" -lt 12 ]; then sleep 60; fi
          done
          echo "Tennis polls: $successes succeeded, $failures degraded"
          if [ "$failures" -gt 2 ] || [ "$successes" -lt 10 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit immutable public-market-only observations
        shell: bash
        run: |
          cd ledger
          git config user.name "SportsEdge Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- research/tennis_prospective
          if ! git diff --cached --quiet; then
            git commit -m "Tennis prospective observations $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:tennis-prospective-data
          else
            echo "No new prospective changes to commit"
          fi
      - name: Fail if observation pipeline was degraded
        if: steps.observe.outputs.exit_code != '0'
        run: |
          echo "Research data persisted, but observation cycle was degraded; inspect preceding JSON."
          exit 1
