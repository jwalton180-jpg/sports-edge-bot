name: Cash-out-first combo research checks
on:
  pull_request:
    paths:
      - "sports_edge/models/combo_cashout.py"
      - "sports_edge/models/combo_quote_archive.py"
      - "sports_edge/combo_quote_panel.py"
      - "tests/test_combo_quote_archive.py"
      - "sports_edge/combo_cashout_panel.py"
      - "sports_edge/app.py"
      - "tests/test_combo_cashout.py"
      - ".github/workflows/combo_cashout_ci.yml"
  push:
    branches: [main]
    paths:
      - "sports_edge/models/combo_cashout.py"
      - "sports_edge/models/combo_quote_archive.py"
      - "sports_edge/combo_quote_panel.py"
      - "tests/test_combo_quote_archive.py"
      - "sports_edge/combo_cashout_panel.py"
      - "sports_edge/app.py"
      - "tests/test_combo_cashout.py"
      - ".github/workflows/combo_cashout_ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cashout-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Only full/partial combo bid and actual sale can value cash-out
        run: python -m pytest -q tests/test_combo_cashout.py tests/test_combo_quote_archive.py
      - name: Parse app and collapsed calculator without import-time Streamlit calls
        run: python -m compileall -q sports_edge/models/combo_cashout.py sports_edge/models/combo_quote_archive.py sports_edge/combo_quote_panel.py sports_edge/combo_cashout_panel.py sports_edge/app.py
