name: MLB rolling-form chronological challenger

on:
  push:
    branches: [adaptive-mlb-rolling-form-20260929]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compare season-only vs rolling-form next-game scoring
        run: |
          python - <<'PY'
          from collections import defaultdict
          from datetime import date
          from math import lgamma, log
          from statistics import mean
          import requests

          BASE="https://statsapi.mlb.com/api/v1/schedule"

          def fetch(start,end):
              r=requests.get(
                  BASE,
                  params={"sportId":1,"startDate":start,"endDate":end,"hydrate":"team"},
                  timeout=45,
              )
              r.raise_for_status()
              rows=[]
              for block in r.json().get("dates",[]) or []:
                  day=block.get("date")
                  for g in block.get("games",[]) or []:
                      state=str((g.get("status") or {}).get("abstractGameState") or "")
                      if state!="Final": continue
                      teams=g.get("teams") or {}
                      away=teams.get("away") or {}; home=teams.get("home") or {}
                      try:
                          aid=int((away.get("team") or {}).get("id"))
                          hid=int((home.get("team") or {}).get("id"))
                          ar=int(away.get("score")); hr=int(home.get("score"))
                      except Exception:
                          continue
                      rows.append((day,int(g.get("gamePk") or 0),aid,hid,ar,hr))
              rows.sort()
              return rows

          def blend(season,recent,n):
              if n<5:return season
              w=.22*min(1.0,n/12.0)
              return (1-w)*season+w*recent

          def pois_nll(actual,mu):
              mu=max(.05,mu)
              return mu-actual*log(mu)+lgamma(actual+1)

          for season,end in ((2025,"2025-09-28"),(2026,"2026-09-28")):
              start=f"{season}-03-20"
              games=fetch(start,end)
              hist=defaultdict(list)
              team_base=[]; team_adapt=[]
              total_base=[]; total_adapt=[]
              nll_base=[]; nll_adapt=[]
              evaluated=0

              for day,gpk,away,home,ar,hr in games:
                  ah=hist[away]; hh=hist[home]
                  if len(ah)>=20 and len(hh)>=20:
                      a_for=mean(x[0] for x in ah)
                      a_allow=mean(x[1] for x in ah)
                      h_for=mean(x[0] for x in hh)
                      h_allow=mean(x[1] for x in hh)

                      a_recent=ah[-12:]; h_recent=hh[-12:]
                      a_for_ad=blend(a_for,mean(x[0] for x in a_recent),len(a_recent))
                      a_allow_ad=blend(a_allow,mean(x[1] for x in a_recent),len(a_recent))
                      h_for_ad=blend(h_for,mean(x[0] for x in h_recent),len(h_recent))
                      h_allow_ad=blend(h_allow,mean(x[1] for x in h_recent),len(h_recent))

                      b_away=max(2.0,min(7.5,.55*a_for+.45*h_allow-.08))
                      b_home=max(2.0,min(7.5,.55*h_for+.45*a_allow+.08))
                      a_away=max(2.0,min(7.5,.55*a_for_ad+.45*h_allow_ad-.08))
                      a_home=max(2.0,min(7.5,.55*h_for_ad+.45*a_allow_ad+.08))

                      team_base.extend((abs(b_away-ar),abs(b_home-hr)))
                      team_adapt.extend((abs(a_away-ar),abs(a_home-hr)))
                      total_base.append(abs((b_away+b_home)-(ar+hr)))
                      total_adapt.append(abs((a_away+a_home)-(ar+hr)))
                      nll_base.extend((pois_nll(ar,b_away),pois_nll(hr,b_home)))
                      nll_adapt.extend((pois_nll(ar,a_away),pois_nll(hr,a_home)))
                      evaluated+=1

                  hist[away].append((ar,hr))
                  hist[home].append((hr,ar))

              def report(metric,b,a):
                  mb=mean(b); ma=mean(a)
                  print("RESULT",season,metric,"n",len(b),
                        "base",round(mb,6),"adaptive",round(ma,6),
                        "delta",round(ma-mb,6),
                        "pct",round((ma/mb-1)*100,3))
              print("GAMES",season,"fetched",len(games),"evaluated",evaluated)
              report("team_run_mae",team_base,team_adapt)
              report("game_total_mae",total_base,total_adapt)
              report("team_poisson_nll",nll_base,nll_adapt)
          PY
