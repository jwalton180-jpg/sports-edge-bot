name: NFL passing live model audit
on:
  push:
    branches: [nfl-passing-model-20260925]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit live NFL passing coverage
        run: |
          python - <<'PY'
          from collections import defaultdict

          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import (
              _event_key,
              _parse_date,
              model_candidates_from_kalshi,
          )
          from sports_edge.models.parlay_intelligence import assess_leg

          result = fetch_supported_sport_catalog(
              sports=("NFL",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=4,
              request_interval_s=0.20,
          )
          print("catalog_complete", result.cursor_exhausted)
          print("catalog_error", result.error)
          grouped = group_kalshi_sports(result.markets)
          nfl = grouped["NFL"]
          rows = [r for r in nfl if r.family == "Passing Yards"]
          events = {_event_key(r.market) for r in rows}
          players = {
              (_event_key(r.market), str(r.market.get("title") or "").split(":",1)[0].strip())
              for r in rows
          }
          print("passing_markets", len(rows))
          print("passing_events", len(events))
          print("passing_players", len(players))
          print("sample_markets", [
              (
                  r.market.get("ticker"),
                  r.market.get("title"),
                  r.market.get("floor_strike"),
                  _parse_date(r.market).isoformat(),
              )
              for r in rows[:10]
          ])

          candidates = model_candidates_from_kalshi(
              grouped,
              sport_filter="NFL",
              include_nfl_passing_yards=True,
              max_nfl_passing_players=24,
          )
          passing = [c for c in candidates if c.market_key == "player_pass_yds"]
          modeled_players = {(c.event_id, c.selection.split(" Over",1)[0].split(" Under",1)[0]) for c in passing}
          best = [assess_leg(c, "best") for c in passing]
          longshot = [assess_leg(c, "longshot") for c in passing]

          print("model_candidates", len(passing))
          print("modeled_player_events", len(modeled_players))
          print("best_qualified", sum(x.qualified for x in best))
          print("longshot_qualified", sum(x.qualified for x in longshot))
          print("top", [
              (
                  x.leg.selection,
                  round(x.fair_probability,4),
                  x.kalshi_probability,
                  None if x.edge_points is None else round(x.edge_points,2),
                  round(x.leg.model_confidence,3),
                  x.qualified,
                  x.warnings,
              )
              for x in sorted(best, key=lambda z:z.score, reverse=True)[:12]
          ])

          assert result.cursor_exhausted, result.error or "NFL catalog incomplete"
          if rows:
              assert passing, "Current Passing Yards markets exist but no model candidates resolved"
          PY
