name: Probe Lower Tennis Sources

on:
  push:
    branches:
      - tennis-itf-challenger-live-score-20261006

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public endpoints
        shell: bash
        run: |
          set +e
          probe() {
            url="$1"
            code=$(curl -L -sS -o /tmp/body --max-time 12 -w '%{http_code}' -A 'Mozilla/5.0' "$url")
            bytes=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            echo "PROBE|$code|$bytes|$url"
            head -c 220 /tmp/body | tr '\n' ' '
            echo
          }
          probe 'https://api.sofascore.com/api/v1/sport/tennis/events/live'
          probe 'https://api.sofascore.com/api/v1/event/17264658'
          probe 'https://www.sofascore.com/api/v1/event/17264658'
          probe 'https://kalshi.com/calendar'
          probe 'https://kalshi.com/markets/kxitfmatch/itf-mens-match/kxitfmatch-26oct06dedmac'
          probe 'https://site.api.espn.com/apis/site/v2/sports/tennis/itf/scoreboard'
          probe 'https://site.api.espn.com/apis/site/v2/sports/tennis/atp-challenger/scoreboard'
          probe 'https://site.api.espn.com/apis/site/v2/sports/tennis/challenger/scoreboard'
          probe 'https://www.itftennis.com/en/tournament/m15-quito/ecu/2026/m-itf-ecu-2026-006/'
          probe 'https://www.itftennis.com/en/tournament/m15-quito/ecu/2026/m-itf-ecu-2026-007/'
          curl -L -sS --max-time 15 -A 'Mozilla/5.0' 'https://www.itftennis.com/en/tournament/m15-quito/ecu/2026/m-itf-ecu-2026-007/' -o /tmp/itf007
          echo 'ITF_URLS'
          grep -Eo 'https?://[^"[:space:]<>]+' /tmp/itf007 | grep -Ei 'api|score|live|draw|result|crio|infront' | head -80 || true
          echo 'ITF_KEYWORDS'
          grep -Eio '.{0,100}(live.?score|crionet|infront|tournament.?key|draws.?and.?results|api).{0,180}' /tmp/itf007 | head -100 || true
          probe 'https://live.itftennis.com/en/live-scores/?tourkey=M-ITF-ECU-2026-007'
          curl -L -sS --max-time 15 -A 'Mozilla/5.0' 'https://live.itftennis.com/en/live-scores/?tourkey=M-ITF-ECU-2026-007' -o /tmp/itflive
          echo 'ITF_LIVE_TARGET'
          grep -in -C 3 -E 'Macias|De Dios|Darwin Andres|Felipe' /tmp/itflive | head -120 || true
          echo 'ITF_LIVE_SCRIPTS'
          grep -Eo 'src="[^"]+"' /tmp/itflive | head -120 || true
          echo 'ITF_LIVE_LINKS'
          grep -Eo 'href="[^"]+"' /tmp/itflive | grep -Ei 'api|score|live|match|json|js' | head -120 || true
          echo 'ITF_LIVE_KEYWORDS'
          grep -in -E 'tourkey|score|match|signalr|socket|api' /tmp/itflive | head -160 || true
          echo 'ITF_WIDGET_CONTEXT'
          grep -in -C 8 -E 'stadion|itf-widget|widget-sdk|tourkey' /tmp/itflive | head -180 || true
          curl -L -sS --max-time 20 'https://widgets.itf-production.sports-data.stadion.io/itf-widget-sdk.umd.js' -o /tmp/itfsdk
          echo "ITF_SDK_BYTES $(wc -c < /tmp/itfsdk)"
          echo 'ITF_SDK_URLS'
          grep -Eo 'https?://[^"[:space:]<>]+' /tmp/itfsdk | sort -u | head -160 || true
          echo 'ITF_SDK_API_TOKENS'
          grep -Eo '.{0,100}(graphql|api/|liveScore|live-score|matches|events|tournament|stadion).{0,180}' /tmp/itfsdk | head -180 || true
          echo 'ITF_SDK_AUTH_CONTEXT'
          python - <<'PY'
          s=open('/tmp/itfsdk',encoding='utf-8',errors='ignore').read()
          for needle in ['platform_UvtcjZ0tuwSV','PLATFORM_UID','platformUid','Authorization','authorization','axios.create','headers:','x-api','X-API','x-platform','platform-uid','platformUid']:
              print('NEEDLE',needle)
              start=0
              shown=0
              while shown<8:
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-700):i+1400])
                  start=i+len(needle)
                  shown+=1
          PY
          echo 'ITF_API_LIVE_LIST'
          api='https://api.itf-production.sports-data.stadion.io/custom/wttCompleteMatchList/2026-10-06'
          code=$(curl -L -sS --max-time 15 -o /tmp/itfapi -w '%{http_code}' "$api")
          echo "ITF_API_STATUS $code BYTES $(wc -c < /tmp/itfapi)"
          grep -io -C 2 -E 'Macias|De Dios|Darwin Andres|Felipe' /tmp/itfapi | head -120 || true
          python - <<'PY'
          import json
          p='/tmp/itfapi'
          try:
              data=json.load(open(p))
          except Exception as exc:
              print('ITF_API_JSON_ERROR',type(exc).__name__,str(exc)[:120])
              raise SystemExit(0)
          def walk(x):
              if isinstance(x,dict):
                  blob=' '.join(str(v) for v in x.values() if isinstance(v,(str,int,float)))
                  if 'macias' in blob.lower() or 'de dios' in blob.lower():
                      print('ITF_API_TARGET_OBJECT',json.dumps(x,ensure_ascii=False)[:8000])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          print('ITF_API_ROOT_TYPE',type(data).__name__)
          walk(data)
          PY
