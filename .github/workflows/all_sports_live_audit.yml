name: All sports live model audit
on:
  push:
    branches: [repair-live-model-coverage-20260925]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit current sports coverage
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg

          for sport in ("MLB","NFL","NBA","WNBA","Tennis"):
              result=fetch_supported_sport_catalog(
                  sports=(sport,),
                  page_limit_per_series=50,
                  page_size=1000,
                  max_workers=4,
                  request_interval_s=0.20,
              )
              grouped=group_kalshi_sports(result.markets)
              rows=grouped.get(sport,[])
              target="Match Winner" if sport=="Tennis" else "Moneyline"
              target_rows=[r for r in rows if r.family==target]
              target_events={
                  str(r.market.get("event_ticker") or r.market.get("ticker") or "")
                  for r in target_rows
              }
              candidates=model_candidates_from_kalshi(grouped,sport_filter=sport)
              candidate_events={c.event_id for c in candidates}
              best=[assess_leg(c,"best") for c in candidates]
              longshot=[assess_leg(c,"longshot") for c in candidates]
              fam=Counter(r.family for r in rows)

              print("SPORT",sport)
              print("  error",result.error)
              print("  complete",result.cursor_exhausted)
              print("  markets",len(result.markets))
              print("  classified",len(rows))
              print("  family_counts",dict(fam))
              print("  target_events",len(target_events))
              print("  model_candidate_events",len(candidate_events))
              print("  model_candidates",len(candidates))
              print("  best_qualified",sum(x.qualified for x in best))
              print("  longshot_qualified",sum(x.qualified for x in longshot))
              print("  sample_failures",[
                  (x.leg.selection,x.warnings)
                  for x in best if not x.qualified
              ][:5])
          PY
