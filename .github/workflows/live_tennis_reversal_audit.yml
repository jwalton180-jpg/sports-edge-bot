name: Live Tennis reversal radar audit

on:
  push:
    branches: [adaptive-player-team-intelligence-20260929]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit current Tennis market history and reversal radar
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.tennis_live import (
              fetch_open_tennis_match_markets,
              fetch_tennis_candle_history,
          )
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.tennis_live_reversal import build_tennis_reversal_radar

          markets=list(fetch_open_tennis_match_markets())
          grouped=group_kalshi_sports(markets)
          candidates=[
              c for c in model_candidates_from_kalshi(grouped,sport_filter="Tennis")
              if c.sport=="Tennis" and c.market_key=="model_h2h" and c.kalshi_ticker
          ]
          tickers=tuple(sorted({str(c.kalshi_ticker) for c in candidates if c.kalshi_ticker}))
          candles=fetch_tennis_candle_history(
              tickers,
              lookback_minutes=60,
              period_interval=1,
          )
          covered={ticker for ticker,rows in candles.items() if rows}
          radar=build_tennis_reversal_radar(
              candidates,
              candles,
              confirmed_live_event_ids=set(),
          )

          print("markets",len(markets))
          print("model_candidates",len(candidates))
          print("canonical_events",len({c.event_id for c in candidates}))
          print("ticker_count",len(tickers))
          print("candle_keys",len(candles))
          print("candle_covered",len(covered))
          print("coverage_pct",round(100*len(covered)/max(1,len(tickers)),2))
          print("radar_total",len(radar))
          print("radar_status",dict(Counter(r.status for r in radar)))
          print("radar_unique_events",len({r.event_id for r in radar}))
          print("top_radar",[
              (
                  r.status,
                  r.selection,
                  r.event_title,
                  round(r.current_price,3),
                  round(r.local_peak,3),
                  round(r.trough_price,3),
                  round(r.dip_points,2),
                  round(r.rebound_points,2),
                  round(r.prior_gap_points,2),
                  round(r.score,1),
                  r.h2h_context,
              )
              for r in radar[:12]
          ])

          assert markets, "no open Tennis match markets returned"
          assert candidates, "no model-first Tennis match candidates returned"
          assert covered, "batch 1-minute Tennis candlesticks returned no usable history"
          assert len(radar)==len({r.event_id for r in radar}), "duplicate physical Tennis match in radar"
          assert all(r.status!="REVERSAL SIGNAL" for r in radar), "unconfirmed live state must never emit actionable reversal signal"
          PY
