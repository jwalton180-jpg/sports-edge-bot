name: Live MLB RBI HRR final diagnostic

on:
  push:
    branches: [mlb-rbi-hrr-final-20260925]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit live MLB run-prop slate state
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.data.mlb_prop_data import (
              find_player_game,
              game_context_for_hitter,
              resolve_player,
          )
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import _parse_date

          result = fetch_supported_sport_catalog(
              sports=("MLB",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.15,
          )
          rows = group_kalshi_sports(result.markets).get("MLB", [])
          target = [r for r in rows if r.family in {"RBIs", "Hits + Runs + RBIs"}]

          print("now_utc", datetime.now(timezone.utc).isoformat())
          print("catalog_error", result.error)
          print("catalog_complete", result.cursor_exhausted)
          print("family_counts", dict(Counter(r.family for r in target)))
          print("date_counts", {
              family: dict(Counter(str(_parse_date(r.market)) for r in target if r.family == family))
              for family in ("RBIs", "Hits + Runs + RBIs")
          })
          print("market_status_counts", {
              family: dict(Counter(str(r.market.get("status") or "missing") for r in target if r.family == family))
              for family in ("RBIs", "Hits + Runs + RBIs")
          })

          # Inspect actual MLB game status for the highest-volume unique players.
          for family in ("RBIs", "Hits + Runs + RBIs"):
              groups = {}
              for row in target:
                  if row.family != family:
                      continue
                  title = str(row.market.get("title") or "")
                  player_name = title.split(":", 1)[0].strip()
                  if not player_name:
                      continue
                  key = (str(row.market.get("event_ticker") or ""), player_name)
                  groups.setdefault(key, []).append(row)
              ranked = sorted(
                  groups.values(),
                  key=lambda group: max(float(r.market.get("volume") or 0) for r in group),
                  reverse=True,
              )[:16]

              statuses = Counter()
              samples = []
              for group in ranked:
                  market = group[0].market
                  title = str(market.get("title") or "")
                  player_name = title.split(":", 1)[0].strip()
                  event_date = _parse_date(market)
                  player = resolve_player(player_name, event_date.year)
                  if player is None:
                      statuses["player_unresolved"] += 1
                      continue
                  team = player.get("currentTeam") or {}
                  team_id = team.get("id")
                  if not team_id:
                      statuses["team_unresolved"] += 1
                      continue
                  game = find_player_game(
                      team_id=int(team_id),
                      event_date=event_date,
                      event_ticker=str(market.get("event_ticker") or ""),
                  )
                  if game is None:
                      statuses["game_unresolved"] += 1
                      continue
                  context = game_context_for_hitter(player, game)
                  status = str((context or {}).get("game_status") or "context_unresolved")
                  statuses[status] += 1
                  if len(samples) < 8:
                      samples.append((
                          player_name,
                          str(event_date),
                          str(market.get("event_ticker") or ""),
                          status,
                      ))
              print("game_status_counts", family, dict(statuses))
              print("game_status_samples", family, samples)
          PY
