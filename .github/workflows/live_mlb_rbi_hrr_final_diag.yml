name: Live MLB RBI HRR final diagnostic

on:
  push:
    branches: [mlb-rbi-hrr-final-20260925]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit live production-depth MLB RBI and H+R+RBI
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg, build_intelligent_parlay

          result = fetch_supported_sport_catalog(
              sports=("MLB",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.15,
          )
          grouped = group_kalshi_sports(result.markets)
          rows = grouped.get("MLB", [])
          family_counts = Counter(r.family for r in rows)

          candidates = model_candidates_from_kalshi(
              grouped,
              sport_filter="MLB",
              include_mlb_hits=True,
              max_mlb_hit_players=12,
              include_mlb_home_runs=True,
              max_mlb_hr_players=12,
              include_mlb_total_bases=True,
              max_mlb_tb_players=12,
              include_mlb_rbis=True,
              max_mlb_rbi_players=12,
              include_mlb_hrr=True,
              max_mlb_hrr_players=12,
              include_mlb_strikeouts=True,
              max_mlb_k_pitchers=8,
          )
          assessments = [assess_leg(c, "best") for c in candidates]
          qualified = [a for a in assessments if a.qualified]
          new_keys = {"batter_rbis", "batter_hrr"}
          new_candidates = [c for c in candidates if c.market_key in new_keys]
          new_assessments = [a for a in assessments if a.leg.market_key in new_keys]
          new_qualified = [a for a in new_assessments if a.qualified]

          full_ticket = build_intelligent_parlay(
              candidates,
              mode="best",
              target_legs=4,
              max_per_event=1,
          )
          new_ticket = build_intelligent_parlay(
              new_candidates,
              mode="best",
              target_legs=4,
              max_per_event=1,
          )

          print("catalog_error", result.error)
          print("catalog_complete", result.cursor_exhausted)
          print("mlb_markets", len(rows))
          print("rbi_markets", family_counts.get("RBIs", 0))
          print("hrr_markets", family_counts.get("Hits + Runs + RBIs", 0))
          print("candidate_by_key", dict(Counter(c.market_key for c in candidates)))
          print("qualified_by_key", dict(Counter(a.leg.market_key for a in qualified)))
          print("new_candidates", len(new_candidates))
          print("new_qualified", len(new_qualified))
          print("full_ticket_legs", len(full_ticket.legs))
          print("new_family_ticket_legs", len(new_ticket.legs))
          print("full_ticket", [
              (
                  x.leg.market_key,
                  x.leg.selection,
                  x.leg.event_title,
                  round(x.fair_probability, 4),
                  round(x.kalshi_probability or 0, 4),
                  round(x.edge_points or 0, 2),
                  round(x.leg.model_confidence, 3),
                  x.leg.model_sample_size,
              )
              for x in full_ticket.legs
          ])
          print("new_ticket", [
              (
                  x.leg.market_key,
                  x.leg.selection,
                  x.leg.event_title,
                  round(x.fair_probability, 4),
                  round(x.kalshi_probability or 0, 4),
                  round(x.edge_points or 0, 2),
                  round(x.leg.model_confidence, 3),
                  x.leg.model_sample_size,
              )
              for x in new_ticket.legs
          ])
          for key in ("batter_rbis", "batter_hrr"):
              subset = [a for a in new_assessments if a.leg.market_key == key]
              print("TOP", key, [
                  (
                      a.leg.selection,
                      round(a.fair_probability, 4),
                      round(a.kalshi_probability or 0, 4),
                      round(a.edge_points or 0, 2),
                      round(a.leg.model_confidence, 3),
                      a.leg.model_sample_size,
                      a.qualified,
                  )
                  for a in sorted(subset, key=lambda x:x.score, reverse=True)[:10]
              ])
          PY
