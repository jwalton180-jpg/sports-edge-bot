name: Tennis market-only movement notifications

on:
  schedule:
    # Best-effort five-minute polling, subject to GitHub Actions delays.
    - cron: '1-56/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tennis_market_only_notifications.yml
      - sports_edge/models/tennis_price_movement.py
      - scripts/tennis_price_only_worker.py
      - sports_edge/data/tennis_push.py
      - sports_edge/models/tennis_push_dispatch.py

permissions:
  contents: write

concurrency:
  group: sportsedge-tennis-market-only-observer
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_TRADING: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      READ_ONLY_KALSHI: "true"
      SPORTSEDGE_NTFY_TOPIC: ${{ secrets.SPORTSEDGE_NTFY_TOPIC }}
      SPORTSEDGE_NTFY_TOKEN: ${{ secrets.SPORTSEDGE_NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: tennis-market-alert-data
          path: ledger
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install source dependencies
        run: pip install -r code/requirements.txt
      - name: Read-only Kalshi movement check
        id: observe
        shell: bash
        run: |
          set -o pipefail
          set +e
          export PYTHONPATH="$(pwd)/code"
          python code/scripts/tennis_price_only_worker.py --data-dir ledger/research/tennis_market_tracking | tee /tmp/tennis-market-only-result.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist acceptance receipts and health
        shell: bash
        run: |
          cd ledger
          git config user.name "SportsEdge Market Observer"
          git config user.email "actions@users.noreply.github.com"
          git add -- research/tennis_market_tracking
          if ! git diff --cached --quiet; then
            git commit -m "Tennis market movement telemetry $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:tennis-market-alert-data
          fi
      - name: Fail closed on degraded observation or push
        if: steps.observe.outputs.exit_code != '0'
        run: |
          echo "Tennis market-only observation incomplete; inspect health record."
          exit 1
