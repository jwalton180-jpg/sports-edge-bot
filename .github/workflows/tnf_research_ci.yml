name: Thursday NFL model-first research
on:
  pull_request:
    branches: [main]
    paths:
      - "sports_edge/models/tnf_research.py"
      - "sports_edge/app.py"
      - "tests/test_tnf_research.py"
      - ".github/workflows/tnf_research_ci.yml"
  push:
    branches: [main]
    paths:
      - "sports_edge/models/tnf_research.py"
      - "sports_edge/app.py"
      - "tests/test_tnf_research.py"
      - ".github/workflows/tnf_research_ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tnf-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: NFL Thursday scoping and audited value candidates
        run: python -m pytest -q tests/test_tnf_research.py tests/test_parlay_intelligence.py tests/test_same_player_dependence.py
      - name: App and model syntax
        run: python -m compileall -q sports_edge/models/tnf_research.py sports_edge/app.py
