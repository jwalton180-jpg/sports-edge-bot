name: Live MLB run-production diagnostic

on:
  push:
    branches: [mlb-rbi-hrr-models-20260925]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit live MLB RBI and H+R+RBI coverage
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg, build_intelligent_parlay

          result = fetch_supported_sport_catalog(
              sports=("MLB",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.15,
          )
          grouped = group_kalshi_sports(result.markets)
          rows = grouped.get("MLB", [])
          family_counts = Counter(r.family for r in rows)

          candidates = model_candidates_from_kalshi(
              grouped,
              sport_filter="MLB",
              include_mlb_hits=False,
              include_mlb_home_runs=False,
              include_mlb_total_bases=False,
              include_mlb_rbis=True,
              max_mlb_rbi_players=12,
              include_mlb_hrr=True,
              max_mlb_hrr_players=12,
              include_mlb_strikeouts=False,
          )
          new_candidates = [c for c in candidates if c.market_key in {"batter_rbis", "batter_hrr"}]
          assessments = [assess_leg(c, "best") for c in new_candidates]
          qualified = [a for a in assessments if a.qualified]
          print("catalog_error", result.error)
          print("catalog_complete", result.cursor_exhausted)
          print("mlb_markets", len(rows))
          print("rbi_markets", family_counts.get("RBIs", 0))
          print("hrr_markets", family_counts.get("Hits + Runs + RBIs", 0))
          for family_name in ("RBIs", "Hits + Runs + RBIs"):
              samples = [r for r in rows if r.family == family_name][:8]
              for sample in samples:
                  m = sample.market
                  print("SAMPLE", family_name, {
                      "title": m.get("title"),
                      "ticker": m.get("ticker"),
                      "event_ticker": m.get("event_ticker"),
                      "series_ticker": m.get("series_ticker"),
                      "floor_strike": m.get("floor_strike"),
                      "yes_sub_title": m.get("yes_sub_title"),
                      "subtitle": m.get("subtitle"),
                  })
          print("model_candidates", len(new_candidates))
          print("candidate_by_key", dict(Counter(c.market_key for c in new_candidates)))
          print("qualified_by_key", dict(Counter(a.leg.market_key for a in qualified)))
          print("qualified_total", len(qualified))

          ticket = build_intelligent_parlay(
              new_candidates,
              mode="best",
              target_legs=4,
              max_per_event=1,
          )
          print("new_family_ticket_legs", len(ticket.legs))
          print("ticket", [
              (
                  x.leg.market_key,
                  x.leg.selection,
                  x.leg.event_title,
                  round(x.fair_probability, 4),
                  round(x.kalshi_probability or 0, 4),
                  round(x.edge_points or 0, 2),
                  round(x.leg.model_confidence, 3),
                  x.leg.model_sample_size,
              )
              for x in ticket.legs
          ])
          for key in ("batter_rbis", "batter_hrr"):
              subset = [a for a in assessments if a.leg.market_key == key]
              print("TOP", key, [
                  (
                      a.leg.selection,
                      round(a.fair_probability, 4),
                      round(a.kalshi_probability or 0, 4),
                      round(a.edge_points or 0, 2),
                      round(a.leg.model_confidence, 3),
                      a.leg.model_sample_size,
                      a.qualified,
                  )
                  for a in sorted(subset, key=lambda x:x.score, reverse=True)[:10]
              ])
          PY
