name: Inspect Sports Edge bootstrap
on:
  push:
    branches: [build-live-signals-20260924]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect packaged baseline
        shell: bash
        run: |
          set -euxo pipefail
          cat .bootstrap/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/baseline.zip
          sha256sum /tmp/baseline.zip
          unzip -t /tmp/baseline.zip
          unzip -l /tmp/baseline.zip | tail -80
          rm -rf /tmp/baseline
          mkdir -p /tmp/baseline
          unzip -q /tmp/baseline.zip -d /tmp/baseline
          ROOT=$(find /tmp/baseline -maxdepth 2 -name pytest.ini -printf '%h\n' | head -1)
          if [ -n "$ROOT" ]; then
            cd "$ROOT"
            pip install -r requirements.txt pytest
            pytest -q
            python -m compileall -q sports_edge app.py launch_on_demand.py
          fi
