name: Premium intelligence restore
on:
  push:
    branches: [premium-intelligence-rebuild-20260924]

permissions:
  contents: write

jobs:
  restore-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baseline test current deployed tree
        shell: bash
        run: |
          pip install -r requirements.txt pytest
          echo "CURRENT_TREE_TESTS"
          pytest -q
          python -m compileall -q sports_edge app.py launch_on_demand.py

      - name: Decode verified packaged baseline
        shell: bash
        run: |
          : > /tmp/sports_edge_baseline.zip
          for f in .bootstrap/part*.b64; do
            tr -d '\n\r' < "$f" | base64 --decode >> /tmp/sports_edge_baseline.zip
          done
          unzip -t /tmp/sports_edge_baseline.zip
          rm -rf /tmp/sports_edge_baseline
          mkdir -p /tmp/sports_edge_baseline
          unzip -q /tmp/sports_edge_baseline.zip -d /tmp/sports_edge_baseline
          ROOT=$(find /tmp/sports_edge_baseline -maxdepth 3 -name pytest.ini -printf '%h\n' | head -1)
          test -n "$ROOT"
          echo "BASELINE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Restore missing verified intelligence modules only
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$BASELINE_ROOT"
          mkdir -p sports_edge/research scripts tests
          for f in             sports_edge/core/availability.py             sports_edge/core/decision.py             sports_edge/core/health.py             sports_edge/core/live.py             sports_edge/data/kalshi_resolution.py             sports_edge/data/kalshi_ws.py             sports_edge/data/live_parsers.py             sports_edge/data/tennis.py             sports_edge/models/baseball.py             sports_edge/models/nfl.py             sports_edge/models/tennis.py             sports_edge/models/tennis_training.py             sports_edge/research/__init__.py             sports_edge/research/line_history.py             sports_edge/research/market_capture.py             sports_edge/research/paperlog.py             sports_edge/research/tipsters.py             scripts/stream_kalshi.py             tests/test_availability.py             tests/test_consensus_tipsters.py             tests/test_decision.py             tests/test_edge.py             tests/test_kalshi_resolution.py             tests/test_line_history.py             tests/test_live.py             tests/test_live_integrity.py             tests/test_live_parsers.py             tests/test_market_capture.py             tests/test_math.py             tests/test_models.py             tests/test_startup.py             tests/test_tennis_orientation.py             tests/test_tennis_training.py
          do
            test -f "$SRC/$f"
            mkdir -p "$(dirname "$f")"
            cp "$SRC/$f" "$f"
          done
          grep -q '^websockets' requirements.txt || echo 'websockets>=13,<16' >> requirements.txt

      - name: Verify restored combined tree
        shell: bash
        run: |
          pip install -r requirements.txt pytest
          echo "COMBINED_TREE_TESTS"
          pytest -q
          python -m compileall -q sports_edge app.py launch_on_demand.py

      - name: Commit restored verified core
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports_edge scripts tests requirements.txt
          if git diff --cached --quiet; then
            echo "No restore changes to commit"
          else
            git commit -m "Restore verified Sports Edge intelligence core"
            git push
          fi
