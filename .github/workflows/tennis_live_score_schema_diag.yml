name: Tennis live-score schema diagnostic

on:
  push:
    branches: [tennis-deep-reversal-20261004]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect ESPN ATP WTA score payloads
        run: |
          python - <<'PY'
          import json, urllib.request
          for league in ("atp","wta"):
              url=f"https://site.api.espn.com/apis/site/v2/sports/tennis/{league}/scoreboard"
              req=urllib.request.Request(url,headers={"User-Agent":"SportsEdgeReadOnly/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  print("STATUS",league,r.status)
                  data=json.loads(r.read().decode("utf-8"))
              events=data.get("events",[]) or []
              print("EVENTS",league,len(events))
              for ev in events[:8]:
                  comps=ev.get("competitions") or []
                  status=ev.get("status") or {}
                  print("EVENT_META",json.dumps({
                      "id":ev.get("id"),
                      "name":ev.get("name"),
                      "date":ev.get("date"),
                      "status":status,
                      "keys":list(ev.keys()),
                      "competition_count":len(comps),
                  },default=str)[:4000])
                  for comp in comps[:12]:
                      competitors=[]
                      for x in comp.get("competitors",[]) or []:
                          athlete=x.get("athlete") or x.get("team") or {}
                          competitors.append({
                              "id":x.get("id"),
                              "name":athlete.get("displayName") or athlete.get("shortDisplayName"),
                              "winner":x.get("winner"),
                              "score":x.get("score"),
                              "linescores":x.get("linescores"),
                              "statistics":x.get("statistics"),
                          })
                      print("COMP",json.dumps({
                          "id":comp.get("id"),
                          "date":comp.get("date"),
                          "status":comp.get("status"),
                          "type":comp.get("type"),
                          "notes":comp.get("notes"),
                          "competitors":competitors,
                          "keys":list(comp.keys()),
                      },default=str)[:10000])
                  print("RAW_KEYS_SAMPLE",json.dumps(ev,default=str)[:16000])
          PY
