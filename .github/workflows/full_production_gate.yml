name: Full production gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Full tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q sports_edge app.py launch_on_demand.py
      - name: Critical imports
        run: |
          python - <<'PY'
          from sports_edge.models.model_evidence import ModelEvidence, model_dominant_fair
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.tennis_research import TennisResearchModel
          from sports_edge.models.parlay_intelligence import build_intelligent_parlay
          import sports_edge.app
          print("production-imports-ok")
          PY
      - name: Streamlit smoke
        shell: bash
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 >/tmp/streamlit.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/tmp/health.txt 2>/dev/null; then
              cat /tmp/health.txt
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $PID || true
          exit 1
