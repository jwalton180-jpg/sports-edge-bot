name: NBA 19+ margin historical holdout
on:
  pull_request:
    paths:
      - "sports_edge/models/nba_margin_sleeper.py"
      - "sports_edge/data/sleeper_sources.py"
      - "sports_edge/models/sleeper_pipeline.py"
      - "scripts/run_nba_margin_replay.py"
      - "tests/test_nba_margin_sleeper.py"
      - ".github/workflows/nba_margin_historical_holdout.yml"
  push:
    branches: [main]
    paths:
      - "sports_edge/models/nba_margin_sleeper.py"
      - "sports_edge/data/sleeper_sources.py"
      - "sports_edge/models/sleeper_pipeline.py"
      - "scripts/run_nba_margin_replay.py"
      - "tests/test_nba_margin_sleeper.py"
      - ".github/workflows/nba_margin_historical_holdout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pytest
      - name: Exact market rules, no leakage, both sides and fail-closed tests
        run: python -m pytest -q tests/test_nba_margin_sleeper.py
      - name: Chronological 2025-26 independent ESPN holdout (not promotion)
        run: python -m scripts.run_nba_margin_replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-19plus-immutable-historical-evidence
          path: nba-margin-historical-evidence/
          if-no-files-found: warn
          retention-days: 30
