name: MLB hits market diagnostic
on:
  push:
    branches: [mlb-hits-model-20260925]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect live MLB Hits markets
        run: |
          python - <<'PY'
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports

          result=fetch_supported_sport_catalog(
              sports=("MLB",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=4,
              request_interval_s=0.20,
          )
          print("error",result.error,"complete",result.cursor_exhausted,"markets",len(result.markets))
          grouped=group_kalshi_sports(result.markets)
          hits=[r for r in grouped["MLB"] if r.family=="Hits"]
          print("hits_rows",len(hits))
          for row in hits[:30]:
              m=row.market
              keep={k:m.get(k) for k in [
                  "ticker","event_ticker","series_ticker","title","subtitle","event_title",
                  "yes_sub_title","no_sub_title","yes_bid","yes_ask","no_bid","no_ask",
                  "yes_bid_dollars","yes_ask_dollars","no_bid_dollars","no_ask_dollars",
                  "strike_type","floor_strike","cap_strike","functional_strike",
                  "close_time","open_time","status"
              ]}
              print(keep)
          PY
