name: Live Tennis deep reversal audit

on:
  push:
    branches: [tennis-deep-reversal-20261004]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit live price plus score reversal path
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.tennis_live import (
              fetch_open_tennis_match_markets,
              fetch_tennis_candle_history,
              fetch_espn_live_tennis_states,
          )
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.tennis_live_reversal import build_tennis_reversal_radar

          markets=list(fetch_open_tennis_match_markets())
          grouped=group_kalshi_sports(markets)
          candidates=[
              c for c in model_candidates_from_kalshi(grouped,sport_filter="Tennis")
              if c.sport=="Tennis" and c.market_key=="model_h2h" and c.kalshi_ticker
          ]
          tickers=tuple(sorted({str(c.kalshi_ticker) for c in candidates if c.kalshi_ticker}))
          candles=fetch_tennis_candle_history(
              tickers,
              lookback_minutes=60,
              period_interval=1,
          )
          states=fetch_espn_live_tennis_states()
          state_index={(s.event_id,s.selection_key):s for s in states}
          confirmed={s.event_id for s in states}
          radar=build_tennis_reversal_radar(
              candidates,
              candles,
              confirmed_live_event_ids=confirmed,
              live_states=state_index,
          )

          print("open_match_markets",len(markets))
          print("model_candidates",len(candidates))
          print("canonical_matches",len({c.event_id for c in candidates}))
          print("candle_tickers",len(candles))
          print("candle_points",sum(len(v) for v in candles.values()))
          print("espn_live_states",len(states))
          print("espn_live_matches",len(confirmed))
          print("radar_status",dict(Counter(r.status for r in radar)))
          print("radar_unique_events",len({r.event_id for r in radar}))
          print("RADAR_TOP",[
              (
                  r.status,
                  r.selection,
                  round(r.current_price,3),
                  round(r.trough_price,3),
                  round(r.dip_points,1),
                  round(r.rebound_points,1),
                  round(r.prior_gap_points,1),
                  round(r.score,1),
                  r.score_turnaround,
                  r.deciding_set,
                  r.current_set_lead,
                  r.live_score,
              )
              for r in radar[:20]
          ])
          assert len(radar)==len({r.event_id for r in radar}), "duplicate physical match in radar"
          assert all(
              r.live_score is not None and (r.score_turnaround or (r.deciding_set and r.current_set_lead>=2))
              for r in radar if r.status=="DEEP REVERSAL"
          ), "deep reversal escaped live-score corroboration"
          PY
