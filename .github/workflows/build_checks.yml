name: Sports Edge build checks
on:
  push:
    branches: [build-live-signals-20260924]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m compileall -q sports_edge app.py launch_on_demand.py
      - name: Public live-source smoke test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import requests
          from sports_edge.data.kalshi import KalshiPublicClient
          from sports_edge.data.mlb import MLBClient

          k = KalshiPublicClient()
          status = k.exchange_status()
          markets = k.markets(status="open", limit=2)
          assert status.status_code == 200
          assert markets.status_code == 200
          assert isinstance(markets.data, dict)

          day = datetime.now(timezone.utc).date()
          mlb = MLBClient().schedule(day)
          assert mlb.status_code == 200

          r = requests.get(
              "https://cdn.espn.com/core/nfl/scoreboard",
              params={"xhr": "1"},
              timeout=10,
          )
          print("NFL CDN status", r.status_code)
          assert r.ok
          data = r.json()
          print("NFL CDN keys", sorted(data.keys())[:20])
          content = data.get("content")
          print("NFL CDN content type", type(content).__name__)
          if isinstance(content, dict):
              print("NFL CDN content keys", sorted(content.keys())[:30])
              for key, value in list(content.items())[:12]:
                  if isinstance(value, dict):
                      print("NEST", key, sorted(value.keys())[:20])
                  elif isinstance(value, list):
                      first_type = type(value[0]).__name__ if value else "empty"
                      print("LIST", key, len(value), first_type)

          print("Kalshi, MLB and NFL CDN public source smoke checks passed")
          PY
