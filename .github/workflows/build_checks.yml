name: Sports Edge build checks
on:
  push:
    branches: [build-live-signals-20260924]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m compileall -q sports_edge app.py launch_on_demand.py
      - name: Public live-source smoke test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from sports_edge.data.kalshi import KalshiPublicClient
          from sports_edge.data.mlb import MLBClient
          from sports_edge.data.nfl import NFLClient

          k = KalshiPublicClient()
          status = k.exchange_status()
          markets = k.markets(status="open", limit=2)
          assert status.status_code == 200
          assert markets.status_code == 200
          assert isinstance(markets.data, dict)

          day = datetime.now(timezone.utc).date()
          mlb = MLBClient().schedule(day)
          assert mlb.status_code == 200

          nfl = NFLClient().scoreboard()
          assert nfl.status_code == 200
          assert isinstance(nfl.data, dict)
          assert isinstance(nfl.data.get("events"), list)
          print("NFL source", nfl.data.get("_source", "espn_site"))
          print("Kalshi, MLB and NFL public source smoke checks passed")
          PY

      - name: Streamlit boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/sports-edge-streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/tmp/health.txt; then
              cat /tmp/health.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sports-edge-streamlit.log
          exit 1
