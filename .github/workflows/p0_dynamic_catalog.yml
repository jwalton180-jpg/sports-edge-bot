name: P0 dynamic Kalshi catalog checks

on:
  push:
    branches: [p0-dynamic-kalshi-catalog-20260925]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Unit and regression tests
        run: pytest -q

      - name: Compile
        run: python -m compileall -q sports_edge app.py launch_on_demand.py

      - name: Import smoke
        run: |
          python - <<'PY'
          import sports_edge.data.kalshi_catalog
          import sports_edge.models.kalshi_sports
          import sports_edge.models.intelligence
          import sports_edge.models.props
          print("imports-ok")
          PY

      - name: Live Kalshi production-path probe
        run: |
          python - <<'PY'
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import catalog_diagnostics, group_kalshi_sports
          from sports_edge.models.game_scope import looks_like_future

          # Mirror production: All uses the compact overview catalog.
          overview = fetch_supported_sport_catalog(
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.18,
              overview_only=True,
          )
          print("overview_series", overview.relevant_series)
          print("overview_pages", overview.pages)
          print("overview_complete", overview.cursor_exhausted)
          print("overview_error", overview.error)
          print("overview_markets", len(overview.markets))
          assert overview.markets, "Kalshi overview returned no open markets"
          assert overview.cursor_exhausted, overview.error or "overview incomplete"

          # Full Tennis is the highest-priority deep catalog and must be nonzero.
          tennis = fetch_supported_sport_catalog(
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.18,
              sports=("Tennis",),
          )
          tdiag = catalog_diagnostics(tennis.markets)
          print("tennis_series", tennis.relevant_series)
          print("tennis_pages", tennis.pages)
          print("tennis_complete", tennis.cursor_exhausted)
          print("tennis_error", tennis.error)
          print("tennis_markets", len(tennis.markets))
          print("tennis_counts", tdiag.counts_by_sport)
          assert tennis.markets, "Kalshi Tennis returned no open markets"
          assert tennis.cursor_exhausted, tennis.error or "Tennis incomplete"
          assert tdiag.counts_by_sport["Tennis"] > 0, "No current Tennis markets classified"
          grouped = group_kalshi_sports(tennis.markets)
          assert not any(looks_like_future(row.market) for rows in grouped.values() for row in rows), "Future leaked into Tennis catalog"

          # Lightweight live checks for the other supported sports match the
          # fast overview behavior and avoid an artificial 200+ request burst.
          for sport in ("MLB", "NBA", "WNBA", "NFL"):
              result = fetch_supported_sport_catalog(
                  page_limit_per_series=50,
                  page_size=1000,
                  max_workers=4,
                  request_interval_s=0.18,
                  sports=(sport,),
                  overview_only=True,
              )
              print(sport, "series", result.relevant_series, "pages", result.pages, "markets", len(result.markets), "error", result.error)
              assert result.cursor_exhausted, result.error or f"{sport} overview incomplete"
          PY

      - name: Streamlit server smoke
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 >/tmp/streamlit.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/tmp/health.txt 2>/dev/null; then
              cat /tmp/health.txt
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $PID || true
          exit 1
