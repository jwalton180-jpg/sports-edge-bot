name: Live Tennis identity H2H diagnostic

on:
  push:
    branches: [repair-canonical-event-identity-tennis-20260929]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Audit live Tennis canonical identity and adaptive evidence
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg, build_intelligent_parlay

          result=fetch_supported_sport_catalog(
              sports=("Tennis",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=6,
              request_interval_s=0.15,
          )
          grouped=group_kalshi_sports(result.markets)
          rows=grouped.get("Tennis",[])
          candidates=model_candidates_from_kalshi(grouped,sport_filter="Tennis")
          assessments=[assess_leg(c,"best") for c in candidates]
          qualified=[a for a in assessments if a.qualified]
          ticket=build_intelligent_parlay(
              candidates,
              mode="best",
              target_legs=6,
              max_per_event=1,
          )

          h2h_rows=[
              c for c in candidates
              if any("Head-to-head before match" in reason for reason in c.model_reasons)
          ]
          trajectory_rows=[
              c for c in candidates
              if any("Form trajectory" in reason for reason in c.model_reasons)
          ]
          sr_trend_rows=[
              c for c in candidates
              if any("serve/return trend" in reason for reason in c.model_reasons)
          ]

          print("catalog_error",result.error)
          print("catalog_complete",result.cursor_exhausted)
          print("tennis_markets",len(rows))
          print("model_candidates",len(candidates))
          print("canonical_events",len({c.event_id for c in candidates}))
          print("qualified_total",len(qualified))
          print("h2h_evidence_candidates",len(h2h_rows))
          print("form_trajectory_candidates",len(trajectory_rows))
          print("serve_return_trend_candidates",len(sr_trend_rows))
          print("ticket_legs",len(ticket.legs))
          print("ticket_unique_events",len({x.leg.event_id for x in ticket.legs}))
          assert len(ticket.legs)==len({x.leg.event_id for x in ticket.legs}), "duplicate physical Tennis match in parlay"
          print("ticket",[
              (
                  x.leg.selection,
                  x.leg.event_title,
                  x.leg.event_id,
                  round(x.fair_probability,4),
                  round(x.kalshi_probability or 0,4),
                  round(x.edge_points or 0,2),
                  round(x.leg.model_confidence,3),
              )
              for x in ticket.legs
          ])
          print("H2H_SAMPLES",[
              (
                  c.selection,
                  c.event_title,
                  [r for r in c.model_reasons if "Head-to-head" in r or "H2H" in r][:3],
              )
              for c in h2h_rows[:10]
          ])
          print("qualified_by_model",dict(Counter(a.leg.model_name for a in qualified)))
          PY
