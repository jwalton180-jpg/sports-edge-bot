name: Repair verification
on:
  push:
    branches: [repair-live-model-coverage-20260925]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Full tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q sports_edge app.py launch_on_demand.py
      - name: Critical imports
        run: |
          python - <<'PY'
          from sports_edge.models.tennis_research import TennisResearchModel
          from sports_edge.models.parlay_intelligence import assess_leg, build_intelligent_parlay
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          import sports_edge.app
          print("repair-imports-ok")
          PY
      - name: Live Tennis coverage sanity
        run: |
          python - <<'PY'
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.parlay_intelligence import assess_leg

          result=fetch_supported_sport_catalog(
              sports=("Tennis",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=4,
              request_interval_s=0.20,
          )
          assert result.cursor_exhausted, result.error
          grouped=group_kalshi_sports(result.markets)
          match_events={
              (row.market.get("event_ticker") or row.market.get("ticker"))
              for row in grouped["Tennis"]
              if row.family=="Match Winner"
          }
          candidates=model_candidates_from_kalshi(grouped,sport_filter="Tennis")
          candidate_events={c.event_id for c in candidates}
          best=[assess_leg(c,"best") for c in candidates]
          longshot=[assess_leg(c,"longshot") for c in candidates]

          print("match_events",len(match_events))
          print("model_candidate_events",len(candidate_events))
          print("coverage",round(len(candidate_events)/max(1,len(match_events)),4))
          print("best_qualified",sum(x.qualified for x in best))
          print("longshot_qualified",sum(x.qualified for x in longshot))

          assert len(match_events) >= 10
          assert len(candidate_events) >= max(8, int(0.75*len(match_events)))
          assert sum(x.qualified for x in best) >= 2
          PY
      - name: Streamlit smoke
        shell: bash
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 >/tmp/streamlit.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/tmp/health.txt 2>/dev/null; then
              cat /tmp/health.txt
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $PID || true
          exit 1
