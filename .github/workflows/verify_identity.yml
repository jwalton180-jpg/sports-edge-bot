name: Verify identity fix
on:
  push:
    branches: [verify-identity-fix-20260924]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m compileall -q sports_edge app.py launch_on_demand.py
