name: Parlay latency verification
on:
  push:
    branches: [parlay-latency-20260925]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q sports_edge app.py launch_on_demand.py
      - name: MLB model latency probe
        run: |
          python - <<'PY'
          import time
          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi

          t0=time.perf_counter()
          result=fetch_supported_sport_catalog(
              sports=("MLB",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=4,
              request_interval_s=0.20,
          )
          t1=time.perf_counter()
          grouped=group_kalshi_sports(result.markets)
          candidates=model_candidates_from_kalshi(grouped,sport_filter="MLB")
          hits=[c for c in candidates if c.market_key=="batter_hits"]
          t2=time.perf_counter()
          print("catalog_s",round(t1-t0,3))
          print("model_s",round(t2-t1,3))
          print("total_s",round(t2-t0,3))
          print("hit_candidates",len(hits))
          print("catalog_complete",result.cursor_exhausted)
          assert result.cursor_exhausted
          PY
      - name: Streamlit smoke
        shell: bash
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 >/tmp/streamlit.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/tmp/health.txt 2>/dev/null; then
              cat /tmp/health.txt
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $PID || true
          exit 1
