name: Live Tennis reversal radar diagnostic

on:
  push:
    branches: [adaptive-player-team-intelligence-20260929]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Audit live Tennis market history and reversal radar
        run: |
          python - <<'PY'
          from collections import Counter
          from sports_edge.data.tennis_live import (
              fetch_open_tennis_match_markets,
              fetch_tennis_candle_history,
          )
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import model_candidates_from_kalshi
          from sports_edge.models.tennis_live_reversal import build_tennis_reversal_radar

          markets=list(fetch_open_tennis_match_markets())
          grouped=group_kalshi_sports(markets)
          candidates=[
              c for c in model_candidates_from_kalshi(grouped,sport_filter="Tennis")
              if c.sport=="Tennis" and c.market_key=="model_h2h" and c.kalshi_ticker
          ]
          tickers=tuple(sorted({str(c.kalshi_ticker) for c in candidates if c.kalshi_ticker}))
          candles=fetch_tennis_candle_history(
              tickers,
              lookback_minutes=60,
              period_interval=1,
          )
          radar=build_tennis_reversal_radar(
              candidates,
              candles,
              confirmed_live_event_ids=set(),
          )

          candle_sizes=[len(v) for v in candles.values()]
          print("open_match_markets",len(markets))
          print("model_candidates",len(candidates))
          print("canonical_matches",len({c.event_id for c in candidates}))
          print("requested_tickers",len(tickers))
          print("candle_tickers",len(candles))
          print("candle_nonempty",sum(1 for v in candles.values() if v))
          print("candle_points_total",sum(candle_sizes))
          print("radar_by_status",dict(Counter(r.status for r in radar)))
          print("radar_unique_events",len({r.event_id for r in radar}))
          assert len(radar)==len({r.event_id for r in radar}), "duplicate physical match in radar"
          assert all(r.status!="REVERSAL SIGNAL" for r in radar), "unconfirmed match promoted to strong signal"
          print("RADAR_TOP",[
              (
                  r.status,
                  r.selection,
                  round(r.current_price,3),
                  round(r.dip_points,1),
                  round(r.rebound_points,1),
                  round(r.prior_gap_points,1),
                  round(r.score,1),
                  r.h2h_context,
                  r.trend_context,
              )
              for r in radar[:12]
          ])
          PY
