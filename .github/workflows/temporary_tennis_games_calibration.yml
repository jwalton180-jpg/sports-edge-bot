name: Temporary Tennis Games Calibration

on:
  push:
    branches: [feature/tennis-games-total-model]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests/test_tennis_games_model.py
      - name: Chronological calibration grid
        run: |
          python - <<'PY'
          import json
          from sports_edge.data.tennis_history import load_recent_tennis_rows
          from sports_edge.models.tennis_games_model import walkforward_games_total_calibration_grid

          for gender in ("men", "women"):
              rows = [
                  row for row in load_recent_tennis_rows(gender, 2024, 2026)
                  if str(row.get("tourney_level") or "").upper() in {"A", "M", "G", "P", "C"}
              ]
              print("DATA", gender, len(rows))
              for year in (2025, 2026):
                  report = walkforward_games_total_calibration_grid(
                      rows,
                      holdout_year=year,
                      alphas=(0.50, 0.60, 0.70, 0.75, 0.80, 0.90, 1.00),
                      lines=(18.5, 20.5, 22.5, 24.5, 26.5),
                  )
                  print("GRID", gender, year, json.dumps(report, sort_keys=True))
          PY
