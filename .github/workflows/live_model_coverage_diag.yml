name: Live model coverage diagnostic
on:
  push:
    branches: [repair-live-model-coverage-20260925]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Live Tennis model coverage
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict

          from sports_edge.data.kalshi_catalog import fetch_supported_sport_catalog
          from sports_edge.data.tennis_history import load_recent_tennis_rows
          from sports_edge.models.kalshi_sports import group_kalshi_sports
          from sports_edge.models.kalshi_model_candidates import (
              _event_choices,
              _parse_date,
              _tennis_model,
              model_candidates_from_kalshi,
          )
          from sports_edge.models.parlay_intelligence import assess_leg
          from sports_edge.models.tennis_research import tennis_level_from_series

          result = fetch_supported_sport_catalog(
              sports=("Tennis",),
              page_limit_per_series=50,
              page_size=1000,
              max_workers=4,
              request_interval_s=0.20,
          )
          print("catalog_error", result.error)
          print("catalog_complete", result.cursor_exhausted)
          print("catalog_markets", len(result.markets))
          print("catalog_series", result.relevant_series)
          print("catalog_pages", result.pages)

          grouped = group_kalshi_sports(result.markets)
          tennis = grouped["Tennis"]
          match_rows = [r for r in tennis if r.family == "Match Winner"]
          print("classified_tennis", len(tennis))
          print("match_rows", len(match_rows))

          events = defaultdict(list)
          for row in match_rows:
              key = str(row.market.get("event_ticker") or row.market.get("ticker") or "")
              events[key].append(row)
          print("match_events", len(events))

          hist = Counter()
          missing_choice_examples = []
          model_fail_examples = []
          model_ok_examples = []
          per_level = Counter()
          for event_id, rows in events.items():
              choices = _event_choices(rows)
              hist[len(choices)] += 1
              if len(choices) != 2:
                  if len(missing_choice_examples) < 10:
                      missing_choice_examples.append((
                          event_id,
                          len(choices),
                          [(r.market.get("ticker"), r.market.get("title"), r.market.get("yes_sub_title"), r.market.get("no_sub_title")) for r in rows[:4]],
                      ))
                  continue
              a, b = choices
              market = a[3]
              series = str(market.get("series_ticker") or "")
              gender, level = tennis_level_from_series(series)
              per_level[level] += 1
              d = _parse_date(market)
              model = _tennis_model(gender, d.year)
              ev = model.probability(a[0], b[0], level=level, as_of=d)
              if ev is None:
                  if len(model_fail_examples) < 20:
                      aa = model.players.get(model._name(a[0]))
                      bb = model.players.get(model._name(b[0]))
                      model_fail_examples.append((
                          event_id, series, level, a[0], b[0],
                          None if aa is None else aa.matches,
                          None if bb is None else bb.matches,
                      ))
              elif len(model_ok_examples) < 10:
                  model_ok_examples.append((event_id, series, level, a[0], b[0], ev.fair_probability, ev.confidence, ev.sample_size))

          print("choice_count_hist", dict(sorted(hist.items())))
          print("levels", dict(per_level))
          print("missing_choice_examples", missing_choice_examples)
          print("model_fail_examples", model_fail_examples)
          print("model_ok_examples", model_ok_examples)

          for gender in ("men", "women"):
              rows = load_recent_tennis_rows(gender, 2025, 2026)
              model = _tennis_model(gender, 2026)
              print(gender, "history_rows", len(rows), "players", len(model.players))

          candidates = model_candidates_from_kalshi(grouped, sport_filter="Tennis")
          print("model_candidates", len(candidates))
          print("model_candidate_events", len({c.event_id for c in candidates}))
          best = [assess_leg(c, "best") for c in candidates]
          longshot = [assess_leg(c, "longshot") for c in candidates]
          print("best_qualified", sum(x.qualified for x in best))
          print("longshot_qualified", sum(x.qualified for x in longshot))
          print("best_top", [
              (x.leg.selection, round(x.fair_probability,4), x.kalshi_probability, x.edge_points, x.score)
              for x in sorted(best, key=lambda z:z.score, reverse=True)[:10]
          ])
          print("longshot_top", [
              (x.leg.selection, round(x.fair_probability,4), x.kalshi_probability, x.edge_points, x.score, x.qualified)
              for x in sorted(longshot, key=lambda z:z.score, reverse=True)[:10]
          ])
          PY
