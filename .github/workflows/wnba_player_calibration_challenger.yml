name: WNBA player probability calibration challenger

on:
  push:
    branches: [wnba-player-prop-models-20260929]
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Tune on 2025 and hold out 2026
        run: |
          python - <<'PY'
          from collections import defaultdict
          from math import log
          from statistics import pstdev
          from sports_edge.core.math import clamp
          from sports_edge.data.basketball_prop_data import player_box_rows, stat_value
          from sports_edge.models.basketball_prop_models import (
              _blended_rate, _expected_minutes, _nb_tail, _opponent_factor,
          )

          METRICS={
              "points":[9.5,14.5,19.5,24.5,29.5],
              "rebounds":[3.5,5.5,7.5,9.5,11.5],
              "assists":[2.5,4.5,6.5,8.5,10.5],
              "threes":[0.5,1.5,2.5,3.5,4.5],
              "pra":[19.5,24.5,29.5,34.5,39.5],
          }
          ALPHAS=[x/100 for x in range(50,101,5)]

          def norm(s):
              import re, unicodedata
              raw=unicodedata.normalize("NFKD",str(s or "").lower())
              raw="".join(ch for ch in raw if not unicodedata.combining(ch))
              return " ".join(re.findall(r"[a-z0-9]+",raw))

          def usable(row):
              try:
                  mins=float(row.get("minutes") or 0)
              except Exception:
                  return False
              return (
                  str(row.get("season_type") or "") in {"2","3","2.0","3.0"}
                  and str(row.get("did_not_play") or "").lower() not in {"true","1","yes"}
                  and mins>0
              )

          def games_by_player(season):
              out=defaultdict(list)
              for row in player_box_rows("WNBA",season):
                  if not usable(row): continue
                  name=norm(row.get("athlete_display_name"))
                  if not name: continue
                  out[name].append(dict(row))
              for rows in out.values():
                  rows.sort(key=lambda r:(str(r.get("game_date") or ""),str(r.get("game_id") or "")))
              return out

          def shrink(p,a):
              return clamp(.5+a*(p-.5),.001,.999)

          def score(rows,a):
              b=sum((shrink(p,a)-y)**2 for p,y in rows)/len(rows)
              ll=sum(-(y*log(shrink(p,a))+(1-y)*log(1-shrink(p,a))) for p,y in rows)/len(rows)
              return b,ll

          all_sets={}
          for season in (2025,2026):
              current=games_by_player(season)
              prior=games_by_player(season-1)
              metric_rows={m:[] for m in METRICS}
              for player,rows in current.items():
                  history=[]
                  prior_rows=tuple(prior.get(player,[]))
                  for row in rows:
                      if len(history)>=6:
                          cur=tuple(history)
                          opp=str(row.get("opponent_team_abbreviation") or "")
                          for metric,lines in METRICS.items():
                              actual=stat_value(row,metric)
                              if actual is None: continue
                              exp_minutes,_=_expected_minutes(cur,prior_rows)
                              rate,_=_blended_rate(cur,prior_rows,metric)
                              if rate is None or exp_minutes<=0: continue
                              opp_mult,_,_=_opponent_factor(
                                  cur,prior_rows,
                                  metric=metric,
                                  opponent_abbr=opp,
                                  baseline_rate=rate,
                              )
                              mu=rate*exp_minutes*opp_mult
                              vals=[
                                  stat_value(x,metric) for x in list(cur)+list(prior_rows[-20:])
                              ]
                              vals=[float(v) for v in vals if v is not None]
                              var=pstdev(vals)**2 if len(vals)>=5 else max(mu*1.25,2.0)
                              if metric=="threes": var=max(var,mu*1.20)
                              elif metric in {"assists","rebounds"}: var=max(var,mu*1.08)
                              else: var=max(var,mu*1.12)
                              for line in lines:
                                  milestone=int(line+.5)
                                  p=_nb_tail(mu,var,milestone)
                                  y=1.0 if float(actual)>=milestone else 0.0
                                  metric_rows[metric].append((p,y))
                      history.append(row)
              all_sets[season]=metric_rows

          selected={}
          for metric in METRICS:
              train=all_sets[2025][metric]
              ranked=sorted((score(train,a)[0],score(train,a)[1],a) for a in ALPHAS)
              selected[metric]=ranked[0][2]
          print("SELECTED",selected)

          for season in (2025,2026):
              for metric in METRICS:
                  rows=all_sets[season][metric]
                  if not rows: continue
                  a=selected[metric]
                  raw=score(rows,1.0); cal=score(rows,a)
                  print(
                      "RESULT",season,metric,"n",len(rows),"alpha",a,
                      "raw_brier",round(raw[0],6),"cal_brier",round(cal[0],6),
                      "delta_brier",round(cal[0]-raw[0],6),
                      "raw_ll",round(raw[1],6),"cal_ll",round(cal[1],6),
                      "delta_ll",round(cal[1]-raw[1],6),
                  )
          PY
